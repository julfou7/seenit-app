name: Validate Plex Refactor

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-plex-1.4.51.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier TypeScript
        run: npm run lint

      - name: Exécuter les tests Plex
        run: npm run test:plex

      - name: Construire le Web et le serveur
        run: npm run build
