name: Reprepare 1.4.126 fallback

on:
  push:
    branches:
      - ops/reprepare-1.4.126-fallback

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/reprepare-1.4.126-fallback
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate canonical release surfaces
        shell: bash
        run: |
          node scripts/prepare-release-files.cjs 1.4.126
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            android/app/build.gradle \
            docs/specifications/android-contract.json \
            docs/specifications/requirements.json \
            docs/specifications/seenit.md \
            package-lock.json \
            package.json \
            server.ts \
            src/store/updateStore.ts | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Diff release inattendu'
            echo 'Actual:'
            printf '%s\n' "$actual"
            echo 'Expected:'
            printf '%s\n' "$expected"
            exit 1
          fi

      - name: Commit clean release tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle \
            docs/specifications/android-contract.json \
            docs/specifications/requirements.json \
            docs/specifications/seenit.md \
            package-lock.json package.json server.ts src/store/updateStore.ts
          git rm .github/workflows/reprepare-1.4.126.yml
          git commit -m "chore(release): préparer SeenIt 1.4.126" -m "Changelog: aucun\n\nDétails techniques:\n- Aligne atomiquement les 8 surfaces canoniques depuis main 44930b06.\n- Fallback #102 après panne prouvée du contrôleur de préparation."
          git push origin HEAD:ops/reprepare-1.4.126-fallback
