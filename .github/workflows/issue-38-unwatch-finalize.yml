name: Finalize Plex Unwatch
on:
  push:
    branches:
      - issue-38-plex-unwatch
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: issue-38-plex-unwatch
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Patch Plex unwatch
        run: python scripts/issue38-patch-v2.py
      - name: Prepare SeenIt 1.4.105
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'versionName "1.4.104"' not in s:
              raise SystemExit('versionName 1.4.104 introuvable')
          p.write_text(s.replace('versionName "1.4.104"', 'versionName "1.4.105"', 1))
          PY
          node scripts/sync-app-version.cjs
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate candidate
        run: |
          npm run test:spec
          npm test
          npx tsc --noEmit
          npm run build
          git diff --check
      - name: Commit candidate
        run: |
          git rm .github/workflows/issue-38-unwatch-finalize.yml scripts/issue38-patch.py scripts/issue38-patch-v2.py
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "fix(plex): synchronise les dé-vu explicites"
          git push origin issue-38-plex-unwatch
