name: Patch Plex Provider Hydration

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-plex-provider-hydration.cjs'
      - '.github/workflows/patch-plex-provider-hydration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Appliquer le patch
        run: node scripts/patch-plex-provider-hydration.cjs

      - name: Vérifier le diff
        run: git diff --check

      - name: Committer le backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: hydrater les GUID du compte depuis Metadata Plex" -m "- charge l'objet Metadata à partir du GUID global du Watch History\n- récupère les coordonnées saison/épisode et le grandparentGuid sans dépendre du schéma GraphQL interne\n- conserve strictement l'identité de l'événement de visionnage"
          git push origin HEAD:main
