name: Patch Download Physical Dedupe

on:
  push:
    branches:
      - fix/download-physical-dedupe-1.4.54
    paths:
      - 'scripts/patch-download-physical-dedupe.cjs'
      - '.github/workflows/patch-download-physical-dedupe.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-physical-dedupe-1.4.54
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: node scripts/patch-download-physical-dedupe.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/services/sonarrRadarr.ts \
            src/store/liveDownloadStore.ts \
            src/features/downloads/downloadIdentity.ts \
            tests/downloadIdentity.test.ts \
            src/store/updateStore.ts \
            android/app/build.gradle
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(downloads): dédupliquer Radarr et qBittorrent par hash" -m "- utilise downloadId/hash comme identité physique du torrent\n- conserve les métadonnées Radarr et la télémétrie qBittorrent\n- évite le double affichage sur les titres localisés\n- empêche la progression de reculer si qBittorrent répond temporairement mal\n- publie SeenIt 1.4.54"
          git push origin HEAD:fix/download-physical-dedupe-1.4.54
