name: Patch Download Physical Dedupe

on:
  push:
    branches:
      - fix/download-physical-dedupe-1.4.54
    paths:
      - 'scripts/patch-download-physical-dedupe.cjs'
      - '.github/workflows/patch-download-physical-dedupe.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-physical-dedupe-1.4.54
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve qBittorrent status during transient misses
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/store/liveDownloadStore.ts';
          let content = fs.readFileSync(path, 'utf8');
          const before = `                if (localMatch.timeleftSeconds) serverItem.timeleftSeconds = localMatch.timeleftSeconds;\n                if (localMatch.timeleft) serverItem.timeleft = localMatch.timeleft;\n              }`;
          const after = `                if (localMatch.timeleftSeconds) serverItem.timeleftSeconds = localMatch.timeleftSeconds;\n                if (localMatch.timeleft) serverItem.timeleft = localMatch.timeleft;\n                if (serverItem.status !== 'error' && localMatch.status !== 'error') {\n                  serverItem.status = localMatch.status;\n                  serverItem.statusText = localMatch.statusText;\n                  serverItem.downloadClient = localMatch.downloadClient || serverItem.downloadClient;\n                }\n              }`;
          if (!content.includes(before)) throw new Error('Bloc de préservation introuvable');
          content = content.replace(before, after);
          fs.writeFileSync(path, content);
          NODE

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/liveDownloadStore.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(downloads): stabiliser l’état qBittorrent entre deux polls" -m "Conserve progression, statut et client connus lorsqu’un poll qBittorrent est momentanément manquant."
          git push origin HEAD:fix/download-physical-dedupe-1.4.54
