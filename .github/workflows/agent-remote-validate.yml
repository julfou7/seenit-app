name: Agent Remote Validate

on:
  push:
    branches:
      - 'agent-staging/**'

permissions:
  contents: read

concurrency:
  group: seenit-agent-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Diagnostic exact staging SHA
    if: startsWith(github.ref, 'refs/heads/agent-staging/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact staging SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact main merge-base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" != 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          base_sha="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$base_sha"
          echo "SEENIT_VALIDATE_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Materialize Android
        run: node scripts/materialize-android-config.cjs

      - name: Classify delivery
        id: classify
        if: always()
        run: npm run delivery:classify
        env:
          DELIVERY_BASE_SHA: ${{ env.SEENIT_VALIDATE_BASE_SHA }}
          FORCED_DELIVERY_MODE: auto
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate change contract
        if: always()
        run: npm run test:spec:changes
        env:
          SPEC_BASE_SHA: ${{ env.SEENIT_VALIDATE_BASE_SHA }}
          DELIVERY_MODE: ${{ steps.classify.outputs.DELIVERY_MODE }}

      - name: Lint TypeScript
        if: always()
        run: npm run lint

      - name: Unit tests implementation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find tests -maxdepth 1 -name '*.test.ts' ! -name 'agentWorkspaceGovernance.test.ts' -print0 | sort -z)
          node --test "${files[@]}"

      - name: Android contract
        if: always()
        run: npm run test:android

      - name: Web build
        if: always()
        run: npm run build
