name: Nettoyage ponctuel synchronisation Git historique

on:
  push:
    branches:
      - cleanup/remove-legacy-git-sync

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/remove-legacy-git-sync
          fetch-depth: 0

      - name: Appliquer le nettoyage
        run: node scripts/cleanup-legacy-git-sync.cjs

      - name: Vérifier le diff produit
        run: |
          git status --short
          git diff --check

      - name: Committer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(architecture): retirer la synchro Git embarquée"
          git push origin HEAD:cleanup/remove-legacy-git-sync
