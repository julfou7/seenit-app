name: Issue 54 - Verrou chemin physique exact

on:
  push:
    branches:
      - fix/issue-54-ai-studio-identity-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-54-ai-studio-identity-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exiger le chemin de transfert exact
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/features/downloads/downloadIdentity.ts')
          s = p.read_text(encoding='utf-8')
          old = '''function transferBasename(value: unknown): string {
            const normalized = normalizeTransferPath(value);
            if (!normalized) return '';
            return normalized.split('/').filter(Boolean).pop() || '';
          }

          export function sameTransferPath(
            a?: DownloadIdentityLike | null,
            b?: DownloadIdentityLike | null
          ): boolean {
            if (!a || !b) return false;
            const aPath = normalizeTransferPath(a.transferPath);
            const bPath = normalizeTransferPath(b.transferPath);
            if (!aPath || !bPath) return false;
            if (aPath === bPath) return true;

            const aBase = transferBasename(aPath);
            const bBase = transferBasename(bPath);
            if (!aBase || aBase !== bBase) return false;

            const aSize = Number(a.size || 0);
            const bSize = Number(b.size || 0);
            if (aSize <= 0 || bSize <= 0) return false;
            return Math.abs(aSize - bSize) / Math.max(aSize, bSize) <= 0.03;
          }
          '''.replace('          ', '')
          new = '''export function sameTransferPath(
            a?: DownloadIdentityLike | null,
            b?: DownloadIdentityLike | null
          ): boolean {
            if (!a || !b) return false;
            const aPath = normalizeTransferPath(a.transferPath);
            const bPath = normalizeTransferPath(b.transferPath);
            return Boolean(aPath && bPath && aPath === bPath);
          }
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('Bloc sameTransferPath attendu introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('tests/downloadIdentity.test.ts')
          ts = t.read_text(encoding='utf-8')
          anchor = "test('rattache Radarr et qBittorrent par chemin de transfert quand le hash manque', () => {"
          idx = ts.index(anchor)
          end = ts.index("\n});", idx) + len("\n});")
          addition = '''

          test('SEENIT-DOWNLOAD-001 un même basename et une même taille ne remplacent jamais un chemin exact', () => {
            assert.equal(sameTransferPath(
              { transferPath: 'd:/downloads-a/Film.2026.1080p', size: 10_000_000_000 },
              { transferPath: 'd:/downloads-b/Film.2026.1080p', size: 10_000_000_000 }
            ), false);
          });'''.replace('          ', '')
          if 'un même basename et une même taille ne remplacent jamais un chemin exact' not in ts:
              ts = ts[:end] + addition + ts[end:]
          t.write_text(ts, encoding='utf-8')
          PY
      - run: npm ci --legacy-peer-deps
      - run: npm test && npm run build
      - name: Commit
        run: |
          rm .github/workflows/issue-54-exact-transfer-path.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(identity): exiger un chemin de transfert exact"
          git push origin HEAD:fix/issue-54-ai-studio-identity-guard
