name: Finaliser issue 10 en 1.4.84

on:
  push:
    branches:
      - fix/issue-10-finalize-1484

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Aligner SeenIt 1.4.84 avec le script officiel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          text = text.replace('versionCode 104083', 'versionCode 104084', 1)
          text = text.replace('versionName "1.4.83"', 'versionName "1.4.84"', 1)
          path.write_text(text)
          PY
          npm run version:sync

      - name: Contrat de changement SPEC
        env:
          SPEC_BASE_SHA: a5b806fd1a8ec5db0ee658d89e8c46154b09183f
        run: npm run test:spec:changes

      - name: SPEC, contrat Android, TypeScript et tests
        run: npm test

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Build PWA
        run: npm run build

      - name: Contrat Android avant Capacitor
        run: npm run test:android

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Contrat Android après Capacitor
        run: npm run test:android

      - name: Compiler l'APK de validation
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Finaliser la branche sans workflow temporaire
        run: |
          rm .github/workflows/issue10-finalize-1484.yml
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "chore(data): aligner SeenIt 1.4.84" -m "- exécute le synchroniseur de version officiel après le correctif Firestore
          - valide la SPEC, le contrat APK, TypeScript et les tests
          - valide le build PWA, Capacitor et la compilation APK
          - retire le workflow temporaire de validation avant livraison sur main"
          git push origin HEAD:fix/issue-10-finalize-1484
