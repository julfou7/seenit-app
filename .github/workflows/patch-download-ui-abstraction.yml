name: Patch Download UI Abstraction

on:
  push:
    branches:
      - fix/download-ui-abstraction-1.4.55
    paths:
      - 'scripts/patch-download-ui-abstraction.cjs'
      - '.github/workflows/patch-download-ui-abstraction.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-ui-abstraction-1.4.55
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: node scripts/patch-download-ui-abstraction.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/downloads/downloadIdentity.ts \
            src/services/sonarrRadarr.ts \
            src/store/liveDownloadStore.ts \
            src/screens/DownloadsScreen.tsx \
            src/components/LiveDownloadBanner.tsx \
            src/components/DownloadModal.tsx \
            src/screens/ShowDetailScreen.tsx \
            tests/downloadIdentity.test.ts \
            src/store/updateStore.ts \
            android/app/build.gradle
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(downloads): masquer l’infrastructure et nettoyer les doublons" -m "- masque Sonarr/Radarr/qBittorrent dans l’interface de suivi\n- remplace les états techniques par des états orientés média\n- fusionne les représentations multiples d’un même torrent\n- migre les anciens doublons persistés via release + taille quand le hash manque\n- conserve deux vrais téléchargements distincts si leurs hashes diffèrent\n- publie SeenIt 1.4.55"
          git push origin HEAD:fix/download-ui-abstraction-1.4.55
