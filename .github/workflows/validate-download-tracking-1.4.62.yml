name: Validate Download Tracking 1.4.62

on:
  push:
    branches:
      - fix/download-tracking-1.4.62

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-tracking-1.4.62
          fetch-depth: 0

      - name: Fetch source branch
        run: git fetch origin fix/download-tracking-cancel-1.4.60

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Port validated downloads fix
        run: bash scripts/port-download-fix-1.4.62.sh

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build Web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated fix
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git commit -m "fix(downloads): fiabiliser le suivi Android" -m $'- garde la télémétrie distante prioritaire sur l’état optimiste SeenIt\n- corrèle une demande entre Radarr/Sonarr et qBittorrent sans utiliser le titre\n- transforme l’arrêt depuis SeenIt en état terminal Annulé sans résurrection\n- rend chaque GET Android de suivi unique et explicitement non cachable\n- conserve le correctif Plex 1.4.61 intact\n- publie SeenIt 1.4.62'
          git push origin HEAD:fix/download-tracking-1.4.62
