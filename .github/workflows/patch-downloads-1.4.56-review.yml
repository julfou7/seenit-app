name: Patch Downloads 1.4.56 Review

on:
  push:
    branches:
      - fix/downloads-identity-ui-1.4.56
    paths:
      - 'scripts/patch-downloads-1.4.56-review.cjs'
      - '.github/workflows/patch-downloads-1.4.56-review.yml'

permissions:
  contents: write

jobs:
  review-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/downloads-identity-ui-1.4.56
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply review patch
        run: node scripts/patch-downloads-1.4.56-review.cjs
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm run test:plex
      - name: Build web and server
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/sonarrRadarr.ts src/store/liveDownloadStore.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(downloads): sécuriser le forçage et les qualités parallèles"
          git push origin HEAD:fix/downloads-identity-ui-1.4.56
