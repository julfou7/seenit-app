name: Finish media relations 130

on:
  push:
    branches: [fix/media-relations-tvdb-exact-130]
    paths:
      - .github/workflows/finish-media-relations-130.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/media-relations-tvdb-exact-130
          fetch-depth: 0

      - name: Apply surgical ShowDetail migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/ShowDetailScreen.tsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {count}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { tmdb, isAdultOrParodyMedia, isMovieAtCinema, isMovieUpcoming } from '../features/shows/tmdb';",
              "import { tmdb, isMovieAtCinema, isMovieUpcoming } from '../features/shows/tmdb';",
              'tmdb import',
          )
          replace_once(
              "import { mediaKeyFrom, relationMediaKeys, toMediaKey } from '../features/shows/mediaRelations';",
              "import { mediaKeyFrom, toMediaKey } from '../features/shows/mediaRelations';",
              'relations import',
          )

          start = s.index("const ASIAN_COUNTRIES = new Set(")
          end = s.index("const getKeywordsFromDetails", start)
          s = s[:start] + s[end:]

          replace_once(
              "  const [visibleSeasons, setVisibleSeasons] = useState(5);\n  const [visibleSimilar, setVisibleSimilar] = useState(10);\n  const [visibleCast, setVisibleCast] = useState(12);",
              "  const [visibleSeasons, setVisibleSeasons] = useState(5);\n  const [visibleCast, setVisibleCast] = useState(12);",
              'visible similar state',
          )
          replace_once(
              "  const seasonObserverRef = useRef<HTMLDivElement>(null);\n  const similarObserverRef = useRef<HTMLDivElement>(null);\n  const castObserverRef = useRef<HTMLDivElement>(null);",
              "  const seasonObserverRef = useRef<HTMLDivElement>(null);\n  const castObserverRef = useRef<HTMLDivElement>(null);",
              'similar observer ref',
          )
          similar_effect = """  useEffect(() => {\n    const observer = new IntersectionObserver((entries) => {\n      if (entries[0].isIntersecting) {\n        setVisibleSimilar(prev => prev + 10);\n      }\n    }, { rootMargin: '100px' });\n    if (similarObserverRef.current) observer.observe(similarObserverRef.current);\n    return () => observer.disconnect();\n  }, []);\n\n"""
          replace_once(similar_effect, '', 'similar observer effect')

          replace_once(
              "                  Dans le même univers\n",
              "                  {universeData.parts[0]?.seenitRelationKind === 'franchise' ? 'Dans la même franchise' : 'Dans le même univers'}\n",
              'TVDB heading',
          )
          replace_once(
              "                  {isSeries ? \"Dans le même univers\" : \"Ordre de visionnage\"}\n",
              "                  Relations\n",
              'relations loading heading',
          )

          marker_start = "            {/* Séries / Films similaires remontés dans À Propos */}\n"
          marker_end = "          </div>\n\n        {isSeries && ("
          start = s.index(marker_start)
          end = s.index(marker_end, start)
          s = s[:start] + marker_end + s[end + len(marker_end):]

          forbidden = ['getPrioritizedSimilarMedia', 'visibleSimilar', 'similarObserverRef', 'Séries similaires', 'Films similaires']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'residual token after migration: {token}')
          if "Dans la même franchise" not in s or "seenitRelationKind" not in s:
              raise SystemExit('dynamic TVDB relation heading missing')
          p.write_text(s)
          PY

      - name: Commit final UI migration and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/finish-media-relations-130.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ShowDetailScreen.tsx
          git commit -m "fix(media): finaliser l'affichage des relations #130" -m "Changelog:\n- Les fiches n'affichent plus les contenus similaires.\n- Le titre TVDB distingue désormais franchise et univers.\n\nDétails techniques:\n- retire le code mort de recommandations de ShowDetail ;\n- conserve un libellé de chargement neutre avant qualification TVDB."
          git push origin HEAD:fix/media-relations-tvdb-exact-130
