name: Issue 54 - Prépare release 1.4.110

on:
  push:
    branches:
      - fix/issue-54-ai-studio-identity-guard

permissions:
  contents: write

jobs:
  version-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-54-ai-studio-identity-guard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Passer SeenIt en 1.4.110
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.4.110"', text, count=1)
          text, n2 = re.subn(r'versionCode\s+\d+', 'versionCode 104110', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Version Android non modifiée de façon déterministe')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Aligner toutes les versions
        run: npm run version:sync

      - name: Matérialiser Android et restaurer Gradle
        run: |
          node scripts/materialize-android-config.cjs
          chmod +x android/gradlew
          git update-index --chmod=+x android/gradlew

      - name: Vérifier le verrou TMDB et le chemin exact
        run: |
          if grep -R "sameLegacyPhysicalTransfer\|cleanMediaTitleForComparison" src; then
            echo "Un fallback d'identité par titre/release subsiste" >&2
            exit 1
          fi
          if grep -n "transferBasename" src/features/downloads/downloadIdentity.ts; then
            echo "Le fallback de chemin par basename subsiste" >&2
            exit 1
          fi

      - name: Tests et build
        run: |
          npm test
          npm run build

      - name: Commit de la candidate 1.4.110
        run: |
          rm .github/workflows/issue-54-release-1.4.110.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore(release): préparer SeenIt 1.4.110" -m "Aligne la version après le verrou TMDB, le transport Android régénérable et la suppression des fallbacks par titre/release."
          git push origin HEAD:fix/issue-54-ai-studio-identity-guard
