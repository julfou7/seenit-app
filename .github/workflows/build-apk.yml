name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare Named APK
        id: version_step
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle | head -1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION" ]; then
            VERSION="1.2.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk "SeenIt-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeenIt-Android-APK
          path: SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version_step.outputs.APP_VERSION }}
          name: SeenIt v${{ steps.version_step.outputs.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
