name: Validate & Release SeenIt

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      release_apk:
        description: Construire, tester et publier la candidate APK courante
        required: true
        default: false
        type: boolean
      android12_smoke:
        description: Ajouter le smoke Android 12 optionnel à cette release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: seenit-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Change
    if: github.event_name != 'workflow_dispatch' || inputs.release_apk != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      delivery_mode: ${{ steps.delivery.outputs.DELIVERY_MODE }}
      dependencies_changed: ${{ steps.delivery.outputs.DEPENDENCIES_CHANGED }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize Validation Metrics
        run: |
          echo "SEENIT_VALIDATION_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "SEENIT_PREFLIGHT_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reject Release Request Outside Main
        if: github.event_name == 'workflow_dispatch' && inputs.release_apk == true
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Une release APK doit être déclenchée depuis main/master."
            exit 1
          fi

      - name: Classify Delivery Path
        id: delivery
        run: npm run delivery:classify
        env:
          DELIVERY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCED_DELIVERY_MODE: auto

      - name: Specification Change Contract
        run: npm run test:spec:changes
        env:
          SPEC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DELIVERY_MODE: ${{ steps.delivery.outputs.DELIVERY_MODE }}

      - name: Validate Specification Integrity
        run: npm run test:spec

      - name: Complete Preflight Metrics
        if: always()
        run: |
          now=$(date +%s)
          echo "SEENIT_PREFLIGHT_SECONDS=$((now-SEENIT_PREFLIGHT_STARTED))" >> "$GITHUB_ENV"

      - name: Resolve Node Cache Identity
        id: runtime
        run: echo "node_version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"

      - name: Restore Exact node_modules Cache
        id: node_modules_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: seenit-node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.runtime.outputs.node_version }}-${{ hashFiles('package.json', 'package-lock.json', 'scripts/patch-local-notifications.cjs', 'scripts/materialize-android-config.cjs') }}

      - name: Install Dependencies on Cache Miss
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: |
          started=$(date +%s)
          set +e
          npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_INSTALL_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Materialize Android Configuration
        run: |
          started=$(date +%s)
          set +e
          node scripts/materialize-android-config.cjs
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_MATERIALIZE_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: TypeScript Check
        run: |
          started=$(date +%s)
          set +e
          npm run lint
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_TYPESCRIPT_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Unit Tests
        run: |
          started=$(date +%s)
          set +e
          npm run test:unit
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_UNIT_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Android Contract for APK-impacting Changes
        if: steps.delivery.outputs.DELIVERY_MODE == 'apk' || (github.event_name == 'workflow_dispatch' && inputs.release_apk == true)
        run: |
          started=$(date +%s)
          set +e
          npm run test:android
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_ANDROID_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Production Dependency Audit
        if: steps.delivery.outputs.DEPENDENCIES_CHANGED == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release_apk == true)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Web and Server Assets
        run: |
          started=$(date +%s)
          set +e
          npm run build
          status=$?
          set -e
          now=$(date +%s)
          echo "SEENIT_BUILD_SECONDS=$((now-started))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Save Trusted node_modules Cache
        if: >-
          success() &&
          steps.node_modules_cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: seenit-node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.runtime.outputs.node_version }}-${{ hashFiles('package.json', 'package-lock.json', 'scripts/patch-local-notifications.cjs', 'scripts/materialize-android-config.cjs') }}

      - name: Publish Validation Summary
        if: always()
        run: |
          now=$(date +%s)
          total_seconds=$((now-SEENIT_VALIDATION_STARTED))
          delivery_mode='${{ steps.delivery.outputs.DELIVERY_MODE }}'
          cache_hit='${{ steps.node_modules_cache.outputs.cache-hit }}'
          if [ -z "$delivery_mode" ]; then delivery_mode='inconnu'; fi
          if [ "$cache_hit" = 'true' ]; then
            cache_status='hit'
          else
            cache_status='miss'
          fi
          {
            echo "## Validate Change"
            echo
            echo "| Mesure | Valeur |"
            echo "|---|---:|"
            echo "| Mode de livraison | $delivery_mode |"
            echo "| Cache node_modules | $cache_status |"
            echo "| Préflight | ${SEENIT_PREFLIGHT_SECONDS:-n/a} s |"
            echo "| Installation npm | ${SEENIT_INSTALL_SECONDS:-0} s |"
            echo "| Matérialisation Android | ${SEENIT_MATERIALIZE_SECONDS:-n/a} s |"
            echo "| TypeScript | ${SEENIT_TYPESCRIPT_SECONDS:-n/a} s |"
            echo "| Tests unitaires | ${SEENIT_UNIT_SECONDS:-n/a} s |"
            echo "| Contrat Android | ${SEENIT_ANDROID_SECONDS:-n/a} s |"
            echo "| Build Web + serveur | ${SEENIT_BUILD_SECONDS:-n/a} s |"
            echo "| Total mesuré | $total_seconds s |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Manual APK Candidate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_apk == true &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.release_candidate.outputs.APP_VERSION }}
      release_base_sha: ${{ steps.release_baseline.outputs.BASE_SHA }}

    steps:
      - name: Checkout Code and Release History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Materialize SeenIt Release Keystore
        run: node scripts/materialize-android-keystore.cjs
        env:
          SEENIT_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.SEENIT_ANDROID_RELEASE_KEYSTORE_B64 }}
          SEENIT_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_STORE_PASSWORD }}
          SEENIT_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Resolve Previous Published Release Baseline
        id: release_baseline
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v${CURRENT_VERSION}" | head -n 1)"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "Aucune release SemVer précédente trouvée."
            exit 1
          fi
          BASE_SHA="$(git rev-list -n 1 "$PREVIOUS_TAG")"
          test -n "$BASE_SHA"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Baseline de release : $PREVIOUS_TAG ($BASE_SHA)"

      - name: Classify Release Candidate
        id: release_delivery
        run: npm run delivery:classify
        env:
          DELIVERY_BASE_SHA: ${{ steps.release_baseline.outputs.BASE_SHA }}
          FORCED_DELIVERY_MODE: apk

      - name: Specification Change Contract
        run: npm run test:spec:changes
        env:
          SPEC_BASE_SHA: ${{ steps.release_baseline.outputs.BASE_SHA }}
          DELIVERY_MODE: apk

      - name: Release Automated Tests
        run: |
          npm run test:spec
          npm run lint
          npm run test:unit
          npm run test:android
        env:
          SEENIT_REQUIRE_ANDROID_KEYSTORE: 'true'
          SEENIT_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_STORE_PASSWORD }}
          SEENIT_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Validate Unpublished Release Version
        id: release_candidate
        run: node scripts/validate-release-immutability.cjs
        env:
          RELEASE_BASE_SHA: ${{ steps.release_baseline.outputs.BASE_SHA }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Revalidate Android Contract After Capacitor Sync
        run: npm run test:android
        env:
          SEENIT_REQUIRE_ANDROID_KEYSTORE: 'true'
          SEENIT_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_STORE_PASSWORD }}
          SEENIT_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Restore Gradle Wrapper Executable Permission
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        env:
          SEENIT_REQUIRE_ANDROID_KEYSTORE: 'true'
          SEENIT_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_STORE_PASSWORD }}
          SEENIT_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SEENIT_ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Prepare Named APK
        run: |
          VERSION="${{ steps.release_candidate.outputs.APP_VERSION }}"
          test -n "$VERSION"
          cp android/app/build/outputs/apk/debug/app-debug.apk "SeenIt-v${VERSION}.apk"
          sha256sum "SeenIt-v${VERSION}.apk" > "SeenIt-v${VERSION}.apk.sha256"
          sha256sum --check "SeenIt-v${VERSION}.apk.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SeenIt-Android-APK-v${{ steps.release_candidate.outputs.APP_VERSION }}
          path: |
            SeenIt-v${{ steps.release_candidate.outputs.APP_VERSION }}.apk
            SeenIt-v${{ steps.release_candidate.outputs.APP_VERSION }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android Upgrade Test Harness
        uses: actions/upload-artifact@v7
        with:
          name: SeenIt-Android-Upgrade-Test-v${{ steps.release_candidate.outputs.APP_VERSION }}
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

  android_upgrade_smoke:
    name: APK Upgrade Smoke (Android 36)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Current APK Pair
        uses: actions/download-artifact@v8
        with:
          name: SeenIt-Android-APK-v${{ needs.build.outputs.app_version }}
          path: current-release

      - name: Download Android Upgrade Test Harness
        uses: actions/download-artifact@v8
        with:
          name: SeenIt-Android-Upgrade-Test-v${{ needs.build.outputs.app_version }}
          path: test-harness

      - name: Verify Current APK Pair
        run: |
          cd current-release
          sha256sum --check "SeenIt-v${{ needs.build.outputs.app_version }}.apk.sha256"

      - name: Download and Verify Previous Official Release
        id: baseline
        run: node scripts/download-upgrade-baseline.cjs upgrade-baseline
        env:
          CURRENT_VERSION: ${{ needs.build.outputs.app_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run N to N+1 Upgrade Smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            bash scripts/android-upgrade-smoke.sh
            "upgrade-baseline/SeenIt-v${{ steps.baseline.outputs.BASELINE_VERSION }}.apk"
            "current-release/SeenIt-v${{ needs.build.outputs.app_version }}.apk"
            "test-harness/app-debug-androidTest.apk"
            "upgrade-reports/android-36"
            "36"

      - name: Capture Android 36 Host Diagnostics
        if: always()
        run: |
          mkdir -p upgrade-reports/android-36
          {
            echo "# free -m"
            free -m
            echo
            echo "# top RSS"
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 20
          } > upgrade-reports/android-36/host-memory.txt
          sudo dmesg --ctime | tail -n 500 > upgrade-reports/android-36/host-dmesg.txt 2>&1 || true

      - name: Publish Upgrade Smoke Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SeenIt-APK-Upgrade-Smoke-Android-36-v${{ needs.build.outputs.app_version }}
          path: upgrade-reports/android-36
          if-no-files-found: warn
          retention-days: 30

  android12_upgrade_smoke:
    name: Optional APK Upgrade Smoke (Android 12)
    needs: build
    if: inputs.android12_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download Current APK Pair
        uses: actions/download-artifact@v8
        with:
          name: SeenIt-Android-APK-v${{ needs.build.outputs.app_version }}
          path: current-release

      - name: Download Android Upgrade Test Harness
        uses: actions/download-artifact@v8
        with:
          name: SeenIt-Android-Upgrade-Test-v${{ needs.build.outputs.app_version }}
          path: test-harness

      - name: Verify Current APK Pair
        run: |
          cd current-release
          sha256sum --check "SeenIt-v${{ needs.build.outputs.app_version }}.apk.sha256"

      - name: Download and Verify Previous Official Release
        id: baseline
        run: node scripts/download-upgrade-baseline.cjs upgrade-baseline
        env:
          CURRENT_VERSION: ${{ needs.build.outputs.app_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run N to N+1 Upgrade Smoke on Android 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            bash scripts/android-upgrade-smoke.sh
            "upgrade-baseline/SeenIt-v${{ steps.baseline.outputs.BASELINE_VERSION }}.apk"
            "current-release/SeenIt-v${{ needs.build.outputs.app_version }}.apk"
            "test-harness/app-debug-androidTest.apk"
            "upgrade-reports/android-31"
            "31"

      - name: Publish Android 12 Smoke Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SeenIt-APK-Upgrade-Smoke-Android-31-v${{ needs.build.outputs.app_version }}
          path: upgrade-reports/android-31
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish Immutable APK Release
    needs: [build, android_upgrade_smoke, android12_upgrade_smoke]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.android_upgrade_smoke.result == 'success' &&
      (needs.android12_upgrade_smoke.result == 'success' || needs.android12_upgrade_smoke.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code and Release History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Revalidate Release Immutability Before Publish
        run: node scripts/validate-release-immutability.cjs
        env:
          RELEASE_BASE_SHA: ${{ needs.build.outputs.release_base_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Validated APK Pair
        uses: actions/download-artifact@v8
        with:
          name: SeenIt-Android-APK-v${{ needs.build.outputs.app_version }}
          path: release-assets

      - name: Verify Downloaded APK Pair
        run: |
          cd release-assets
          VERSION="${{ needs.build.outputs.app_version }}"
          test -f "SeenIt-v${VERSION}.apk"
          test -f "SeenIt-v${VERSION}.apk.sha256"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          sha256sum --check "SeenIt-v${VERSION}.apk.sha256"

      - name: Generate Release Notes
        id: release_notes
        run: node scripts/generate-release-notes.cjs
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: SeenIt v${{ needs.build.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: ${{ steps.release_notes.outputs.NOTES }}
          generate_release_notes: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-assets/SeenIt-v${{ needs.build.outputs.app_version }}.apk
            release-assets/SeenIt-v${{ needs.build.outputs.app_version }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
