name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seenit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align SeenIt Version
        id: version_sync
        run: |
          node scripts/sync-app-version.cjs
          if git diff --quiet -- android/app/build.gradle src/store/updateStore.ts server.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/app/build.gradle src/store/updateStore.ts server.ts
            git commit -m "chore(release): aligner la version SeenIt"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        if: steps.version_sync.outputs.changed != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Install Dependencies
        if: steps.version_sync.outputs.changed != 'true'
        run: npm ci --legacy-peer-deps

      - name: Type Check
        if: steps.version_sync.outputs.changed != 'true'
        run: npm run lint

      - name: Plex Integrity Tests
        if: steps.version_sync.outputs.changed != 'true'
        run: npm run test:plex

      - name: Build Web Assets & Sync Capacitor
        if: steps.version_sync.outputs.changed != 'true'
        run: |
          npm run build
          npx cap sync android

      - name: Ensure Debug Keystore
        if: steps.version_sync.outputs.changed != 'true'
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        if: steps.version_sync.outputs.changed != 'true'
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare Named APK
        if: steps.version_sync.outputs.changed != 'true'
        id: version_step
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle | head -1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION" ]; then
            VERSION="1.2.0"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk "SeenIt-v${VERSION}.apk"

      - name: Upload APK Artifact
        if: steps.version_sync.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SeenIt-Android-APK
          path: SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
          retention-days: 30

      - name: Generate Release Notes
        if: steps.version_sync.outputs.changed != 'true'
        id: release_notes
        run: node scripts/generate-release-notes.cjs
        env:
          APP_VERSION: ${{ steps.version_step.outputs.APP_VERSION }}

      - name: Publish GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.version_sync.outputs.changed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_step.outputs.APP_VERSION }}
          name: SeenIt v${{ steps.version_step.outputs.APP_VERSION }}
          draft: false
          prerelease: false
          body: ${{ steps.release_notes.outputs.NOTES }}
          generate_release_notes: false
          files: |
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}