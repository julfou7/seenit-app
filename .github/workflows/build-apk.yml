name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seenit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Specification Change Contract
        run: npm run test:spec:changes
        env:
          SPEC_BASE_SHA: ${{ github.event.before }}

      - name: Specifications, Android Contract & Automated Tests
        run: npm test

      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Revalidate Android Contract After Capacitor Sync
        run: npm run test:android

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "La clé de signature historique manque : publication refusée."
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare Named APK
        id: version_step
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle | head -1 | awk -F '"' '{print $2}')
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk "SeenIt-v${VERSION}.apk"
          sha256sum "SeenIt-v${VERSION}.apk" > "SeenIt-v${VERSION}.apk.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SeenIt-Android-APK
          path: |
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk.sha256
          retention-days: 30

      - name: Generate Release Notes
        id: release_notes
        run: node scripts/generate-release-notes.cjs
        env:
          APP_VERSION: ${{ steps.version_step.outputs.APP_VERSION }}

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version_step.outputs.APP_VERSION }}
          name: SeenIt v${{ steps.version_step.outputs.APP_VERSION }}
          draft: false
          prerelease: false
          body: ${{ steps.release_notes.outputs.NOTES }}
          generate_release_notes: false
          files: |
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk
            SeenIt-v${{ steps.version_step.outputs.APP_VERSION }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
