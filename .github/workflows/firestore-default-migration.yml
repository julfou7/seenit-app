name: Migrate Firestore Default Free Tier

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: seenit-firestore-default-migration
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0201895414
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/799043440232/locations/global/workloadIdentityPools/seenit-github/providers/seenit-main
  GCP_DEPLOY_SERVICE_ACCOUNT: seenit-github-deployer@gen-lang-client-0201895414.iam.gserviceaccount.com

jobs:
  migrate:
    name: Verify backups and migrate default
    if: >-
      github.event.issue.number == 23 &&
      github.event.issue.pull_request == null &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/migrate-firestore-default ')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify owner command and immutable main SHA
        id: command
        shell: bash
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMAND_BODY" =~ ^/migrate-firestore-default\ project=gen-lang-client-0201895414\ sha=([0-9a-f]{40})$ ]]; then
            echo 'Commande de migration refusée : syntaxe exacte requise.'
            exit 1
          fi
          requested_sha="${BASH_REMATCH[1]}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$requested_sha" != "$checked_out_sha" ]]; then
            echo "Commande périmée : requested=${requested_sha}, current=${checked_out_sha}."
            exit 1
          fi
          echo "sha=$requested_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --legacy-peer-deps --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Authenticate with the temporary migration identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Export, rehearse, cut over and verify
        id: migration
        shell: bash
        env:
          SEENIT_MIGRATION_SHA: ${{ steps.command.outputs.sha }}
          SEENIT_MIGRATION_CONFIRMATION: ${{ github.event.comment.body }}
        run: bash scripts/migrate-firestore-default.sh

      - name: Publish a redacted success checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIN_SHA: ${{ steps.command.outputs.sha }}
        run: >-
          gh issue comment 23
          --repo "$GITHUB_REPOSITORY"
          --body "<!-- seenit-firestore-migration -->
          Migration Firestore terminée sur main ${MAIN_SHA} : \`default\` est la seule base active,
          reste en Standard \`eur3\`, porte le quota gratuit, a retrouvé exactement son digest documentaire,
          ses règles canoniques et Delete Protection. Les deux exports privés expirent sous 30 jours.
          Preuve : ${RUN_URL}."

      - name: Publish an actionable failure checkpoint
        if: failure() && steps.command.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIN_SHA: ${{ steps.command.outputs.sha }}
        run: >-
          gh issue comment 23
          --repo "$GITHUB_REPOSITORY"
          --body "<!-- seenit-firestore-migration -->
          La migration Firestore sur main ${MAIN_SHA} a été interrompue. Le contrôleur a exécuté son rollback ;
          si l’intégrité de \`default\` n’a pas pu être prouvée, il a volontairement laissé Cloud Run et les règles
          en maintenance. Prochaine action exacte : lire la dernière étape et la ligne \`ROLLBACK\` de ${RUN_URL},
          puis reprendre depuis les exports privés sans relancer de suppression."
