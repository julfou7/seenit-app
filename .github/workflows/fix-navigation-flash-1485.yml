name: Navigation flash 1.4.85

on:
  push:
    branches: [fix/navigation-first-load-flash-1485]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - name: Installer
        run: npm ci --legacy-peer-deps
      - name: Appliquer le correctif
        run: node scripts/fix-nav-flash-1485.cjs
      - name: Synchroniser la version
        run: npm run version:sync
      - name: Tester
        run: npm test
      - name: Auditer
        run: npm audit --omit=dev --audit-level=high
      - name: Construire
        run: npm run build
      - name: Vérifier Android avant sync
        run: npm run test:android
      - name: Synchroniser Android
        run: npx cap sync android
      - name: Vérifier Android après sync
        run: npm run test:android
      - name: Compiler APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Finaliser la branche
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git rm .github/workflows/fix-navigation-flash-1485.yml scripts/fix-nav-flash-1485.cjs
          git add -A
          git commit -m "perf(ux): supprimer le flash noir au premier changement d’écran" -m "- précharge les chunks privés pendant le splash sans supprimer le code splitting
          - conserve l’écran déjà affiché grâce aux transitions React lors du premier changement d’onglet
          - applique la même transition à la première ouverture d’une fiche média
          - ajoute SEENIT-UX-003 et des tests de préchargement, déduplication et intégration
          - aligne SeenIt 1.4.85 et valide PWA, Capacitor, contrat Android et compilation APK"
          git push origin HEAD:fix/navigation-first-load-flash-1485
