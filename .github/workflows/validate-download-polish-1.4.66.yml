name: Validate Download Polish 1.4.66

on:
  push:
    branches:
      - fix/download-polish-series-sync-1.4.66

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-polish-series-sync-1.4.66
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply patch
        run: node scripts/patch-download-polish-1.4.66.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build Web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "fix(downloads): synchroniser et affiner le suivi" -m $'- synchronise les demandes de téléchargement entre PWA et APK via Firestore\n- monitore explicitement l’épisode Sonarr ciblé avant EpisodeSearch\n- corrige les parenthèses techniques dans les titres de séries\n- recentre les posters et compacte les cartes de téléchargement\n- remplace les trois points de recherche par un indicateur discret\n- applique le doré SeenIt aux titres et atténue le badge de résolution\n- publie SeenIt 1.4.66'
          git push origin HEAD:fix/download-polish-series-sync-1.4.66
