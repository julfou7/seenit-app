name: Validate Cancel Terminal 1.4.60

on:
  push:
    branches:
      - fix/download-tracking-cancel-1.4.60

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-tracking-cancel-1.4.60
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply cancellation terminal fix
        run: node scripts/fix-cancel-terminal-1.4.60.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build Web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated fix
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git commit -m "fix(downloads): préserver l’état annulé" -m $'- conserve Annulé sur les polls suivants au lieu de le convertir en Terminé\n- empêche une annulation de déclencher une notification de fin\n- exclut les cartes annulées du polling actif rapide\n- garde Annulé prioritaire lors d’une fusion transitoire de représentations'
          git push origin HEAD:fix/download-tracking-cancel-1.4.60
