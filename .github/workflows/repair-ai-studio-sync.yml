name: Réparation contrôlée AI Studio

on:
  push:
    branches:
      - fix/ai-studio-android-sync-1.4.100

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurer Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Appliquer la réparation et synchroniser la version
        run: node scripts/repair-ai-studio-sync.cjs

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Valider SPEC, Android et tests
        run: npm test

      - name: Auditer les dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Construire les assets Web
        run: npm run build

      - name: Configurer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Vérifier le certificat Android Firebase
        shell: bash
        run: |
          CERT_SHA1="$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/{gsub(":", "", $2); print tolower($2); exit}')"
          test "$CERT_SHA1" = "7427c6a9914d1fa8f0d3c871e271e35392747bbb"
          echo "Empreinte SHA-1 Firebase/signature Android validée."

      - name: Synchroniser Capacitor Android
        run: npx cap sync android

      - name: Revalider le contrat Android
        run: npm run test:android

      - name: Vérifier les droits exécutables
        run: |
          test -x android/gradlew
          test -x scripts/pull.sh

      - name: Construire les APK de validation
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Vérifier le diff
        run: git diff --check

      - name: Retirer le harnais temporaire
        run: rm scripts/repair-ai-studio-sync.cjs .github/workflows/repair-ai-studio-sync.yml

      - name: Committer la candidate validée
        shell: bash
        run: |
          git config user.name "SeenIt CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): finaliser la réparation AI Studio en 1.4.100 [repair-generated]"
          git push origin HEAD:fix/ai-studio-android-sync-1.4.100
