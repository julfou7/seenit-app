name: Finalize issue 38 candidate

on:
  push:
    branches:
      - issue-38-plex-additive-toast

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare SeenIt 1.4.104
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # 1. Intégration réelle du garde additif dans la persistance Plex.
          sync_path = Path('src/features/plex/syncPlex.ts')
          sync = sync_path.read_text()
          import_marker = "import { buildLibraryStateSignature } from '../../lib/userIsolation';\n"
          additive_import = import_marker + "import { mergeAdditivePlexProgress } from './plexAdditiveSync';\n"
          if "from './plexAdditiveSync'" not in sync:
              if import_marker not in sync:
                  raise SystemExit('Import marker syncPlex introuvable')
              sync = sync.replace(import_marker, additive_import, 1)

          old_persist = """          const chunkBatch = writeBatch(db);\n          for (const [id, data] of chunk) {\n            const ref = doc(db, `users/${user.uid}/shows`, id);\n            const cleanData = cleanShowForFirestore(data, user.uid);\n            chunkBatch.set(ref, cleanData, { merge: true });\n          }\n          await chunkBatch.commit();\n"""
          new_persist = """          await runTransaction(db, async (transaction) => {\n            const refs = chunk.map(([id, data]) => ({\n              id,\n              data,\n              ref: doc(db, `users/${user.uid}/shows`, id)\n            }));\n            const currentSnapshots = await Promise.all(\n              refs.map(({ ref }) => transaction.get(ref))\n            );\n\n            for (let index = 0; index < refs.length; index++) {\n              const { data, ref } = refs[index];\n              const snapshot = currentSnapshots[index];\n              const currentSeenItState = snapshot.exists() ? snapshot.data() : null;\n              const additiveData = mergeAdditivePlexProgress(currentSeenItState, data);\n              const cleanData = cleanShowForFirestore(additiveData, user.uid);\n              transaction.set(ref, cleanData, { merge: true });\n            }\n          });\n"""
          if 'mergeAdditivePlexProgress(currentSeenItState, data)' not in sync:
              if old_persist not in sync:
                  raise SystemExit('Bloc de persistance Plex introuvable')
              sync = sync.replace(old_persist, new_persist, 1)
          sync_path.write_text(sync)

          # 2. Toast mobile : largeur utile complète + retour à la ligne sans clamp.
          toast_path = Path('src/components/ToastContainer.tsx')
          toast = toast_path.read_text()
          old_card = 'className="relative overflow-hidden bg-zinc-900/95 backdrop-blur-2xl border border-white/15 rounded-full shadow-[0_14px_40px_rgba(0,0,0,0.85)] px-3.5 py-2 sm:px-4 sm:py-2.5 flex items-center gap-2.5 w-auto max-w-full"'
          new_card = 'className="relative overflow-hidden bg-zinc-900/95 backdrop-blur-2xl border border-white/15 rounded-2xl sm:rounded-full shadow-[0_14px_40px_rgba(0,0,0,0.85)] px-3.5 py-2 sm:px-4 sm:py-2.5 flex items-center gap-2.5 w-full sm:w-auto max-w-full"'
          old_text = 'className="text-zinc-100 text-[12px] sm:text-xs font-semibold leading-snug whitespace-nowrap sm:whitespace-normal line-clamp-2"'
          new_text = 'className="text-zinc-100 text-[12px] sm:text-xs font-semibold leading-snug whitespace-normal break-words"'
          if new_card not in toast:
              if old_card not in toast:
                  raise SystemExit('Carte toast compacte introuvable')
              toast = toast.replace(old_card, new_card, 1)
          if new_text not in toast:
              if old_text not in toast:
                  raise SystemExit('Texte toast compact introuvable')
              toast = toast.replace(old_text, new_text, 1)
          toast_path.write_text(toast)

          # 3. Exigences traçables.
          req_path = Path('docs/specifications/requirements.json')
          req = json.loads(req_path.read_text())
          requirements = req['requirements']

          plex_id = 'SEENIT-PLEX-006'
          if not any(item.get('id') == plex_id for item in requirements):
              plex_entry = {
                  'id': plex_id,
                  'title': 'Synchronisation Plex strictement additive face aux actions SeenIt',
                  'targets': ['pwa', 'apk'],
                  'tests': [
                      {'file': 'tests/plexAdditiveSync.test.ts', 'contains': 'SEENIT-PLEX-006 un dé-vu Plex ne retire jamais un film marqué vu dans SeenIt'},
                      {'file': 'tests/plexAdditiveSync.test.ts', 'contains': 'SEENIT-PLEX-006 un dé-vu Plex conserve la progression manuelle des épisodes'},
                      {'file': 'tests/plexAdditiveSync.test.ts', 'contains': 'SEENIT-PLEX-006 une nouvelle preuve Plex s’ajoute sans écraser les données SeenIt'},
                      {'file': 'tests/plexAdditiveSync.test.ts', 'contains': 'SEENIT-PLEX-006 la fusion additive est idempotente'},
                      {'file': 'tests/plexAdditiveSync.test.ts', 'contains': 'SEENIT-PLEX-006 protège l’écriture Firestore de la synchro Plex avec un merge additif'}
                  ]
              }
              idx = next(i for i, item in enumerate(requirements) if item.get('id') == 'SEENIT-PLEX-005') + 1
              requirements.insert(idx, plex_entry)

          ux_id = 'SEENIT-UX-004'
          if not any(item.get('id') == ux_id for item in requirements):
              ux_entry = {
                  'id': ux_id,
                  'title': 'Toasts mobiles longs entièrement lisibles',
                  'targets': ['pwa', 'apk'],
                  'tests': [
                      {'file': 'tests/toastLayout.test.ts', 'contains': 'SEENIT-UX-004 les toasts longs reviennent à la ligne sans troncature sur mobile'},
                      {'file': 'tests/toastLayout.test.ts', 'contains': 'SEENIT-UX-004 le toast reste au-dessus de la navigation et de la safe area'}
                  ]
              }
              idx = next(i for i, item in enumerate(requirements) if item.get('id') == 'SEENIT-UX-003') + 1
              requirements.insert(idx, ux_entry)
          req_path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + '\n')

          # 4. SPEC vivante.
          spec_path = Path('docs/specifications/seenit.md')
          spec = spec_path.read_text()
          plex_marker = "- **SEENIT-PLEX-005** — Un média Plex ne devient vu qu'avec une preuve de visionnage autoritative.\n  Une activité `cloud` qui porte exactement la même identité technique qu'un film de la watchlist\n  reste ambiguë et est exclue de l'historique tant qu'une source forte (`account-history`, historique\n  PMS ou `viewCount > 0`) ne confirme pas le visionnage. Le rapprochement ne se fait jamais par\n  titre ou année ; en cas d'ambiguïté SeenIt conserve l'état non vu.\n"
          plex_addition = plex_marker + "- **SEENIT-PLEX-006** — La synchronisation Plex est strictement additive face à l'état SeenIt.\n  Un média ou épisode absent des preuves Plex, repassé non vu côté Plex ou simplement absent d'un\n  full scan ne retire jamais un marqueur de visionnage, un `episodeRecord`, une note ou une progression\n  déjà enregistrés dans SeenIt. Avant chaque écriture Plex, l'état Firestore courant est relu dans une\n  transaction puis fusionné par union ; une nouvelle preuve Plex peut ajouter un visionnage, jamais\n  transformer une absence de preuve en suppression. Les actions manuelles SeenIt restent prioritaires.\n"
          if '**SEENIT-PLEX-006**' not in spec:
              if plex_marker not in spec:
                  raise SystemExit('Marqueur PLEX-005 introuvable dans la SPEC')
              spec = spec.replace(plex_marker, plex_addition, 1)

          ux_marker = "- **SEENIT-UX-003** — La première navigation vers un écran privé chargé paresseusement ne\n  remplace jamais l'écran courant par un écran vide ou noir. Les chunks des onglets et des fiches\n  média restent séparés du bundle initial, sont préchargés en arrière-plan pendant le splash et les\n  changements d'écran sont engagés dans une transition React afin de conserver le contenu déjà\n  affiché jusqu'à ce que la prochaine vue soit prête.\n"
          ux_addition = ux_marker + "- **SEENIT-UX-004** — Un toast mobile long utilise toute la largeur utile disponible, revient à la\n  ligne sans troncature et reste au-dessus de la navigation basse et de la safe area. La règle vaut\n  pour la PWA et l'APK, notamment pour le bilan détaillé d'une synchronisation Plex.\n"
          if '**SEENIT-UX-004**' not in spec:
              if ux_marker not in spec:
                  raise SystemExit('Marqueur UX-003 introuvable dans la SPEC')
              spec = spec.replace(ux_marker, ux_addition, 1)
          spec_path.write_text(spec)

          # 5. Registre de décisions durables.
          registry_path = Path('docs/requests/registry.md')
          registry = registry_path.read_text().rstrip() + '\n'
          row_plex = "| USR-2026-09-02-004 | 2026-09-02 | La synchronisation Plex est explicitement additive : un média ou épisode « dé-vu » côté Plex ne supprime jamais un visionnage, une progression ou une action manuelle déjà enregistrés dans SeenIt. | `SEENIT-PLEX-006`, [issue #38](https://github.com/julfou7/seenit-app/issues/38) | active |\n"
          row_toast = "| USR-2026-09-02-005 | 2026-09-02 | Les toasts mobiles longs, notamment le bilan de synchronisation Plex, doivent rester entièrement lisibles dans la largeur utile et au-dessus de la navigation/safe area. | `SEENIT-UX-004`, [issue #38](https://github.com/julfou7/seenit-app/issues/38) | active |\n"
          if 'USR-2026-09-02-004' not in registry:
              registry += row_plex
          if 'USR-2026-09-02-005' not in registry:
              registry += row_toast
          registry_path.write_text(registry)

          # 6. Nouvelle release comportementale.
          gradle_path = Path('android/app/build.gradle')
          gradle = gradle_path.read_text()
          if 'versionName "1.4.104"' not in gradle:
              if 'versionName "1.4.103"' not in gradle:
                  raise SystemExit('Version Android 1.4.103 introuvable')
              gradle = gradle.replace('versionName "1.4.103"', 'versionName "1.4.104"', 1)
          gradle_path.write_text(gradle)
          PY

          npm run version:sync
          rm .github/workflows/issue-38-finalize.yml

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate candidate
        run: |
          npm test
          npm run build
          git diff --check

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: protège la synchro Plex additive et les toasts mobiles"
          git push origin HEAD:issue-38-plex-additive-toast
