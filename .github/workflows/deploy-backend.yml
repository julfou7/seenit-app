name: Deploy Canonical Backend

on:
  push:
    branches: [main]
    paths:
      - server.ts
      - src/**
      - package.json
      - package-lock.json
      - project.toml
      - scripts/backend-runtime-impact.cjs
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: seenit-canonical-backend
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0201895414
  GCP_PROJECT_NUMBER: '799043440232'
  GCP_REGION: us-west1
  GCP_SERVICE: seenit-app
  GCP_ARTIFACT_REPOSITORY: cloud-run-source-deploy
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/799043440232/locations/global/workloadIdentityPools/seenit-github/providers/seenit-main
  GCP_DEPLOY_SERVICE_ACCOUNT: seenit-github-deployer@gen-lang-client-0201895414.iam.gserviceaccount.com
  CANONICAL_ORIGIN: https://seenit.ai.studio

jobs:
  deploy_backend:
    name: Deploy Canonical Backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Wait for the canonical validation run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$runs")"
            status="$(jq -r '.workflow_runs[0].status // empty' <<<"$runs")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs")"

            if [[ -z "$run_id" ]]; then
              sleep 5
              continue
            fi
            echo "Validation source: run ${run_id}, status=${status}, conclusion=${conclusion:-pending}"
            if [[ "$status" == 'completed' ]]; then
              if [[ "$conclusion" != 'success' ]]; then
                echo "La validation canonique du SHA ${GITHUB_SHA} n'est pas verte. Déploiement refusé."
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done
          echo "Aucune validation verte trouvée pour ${GITHUB_SHA} dans la fenêtre autorisée."
          exit 1

      - name: Set up Node.js 22 for runtime impact analysis
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependency graph tooling
        run: npm ci --legacy-peer-deps --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Detect a real backend runtime impact
        id: impact
        run: node scripts/backend-runtime-impact.cjs
        env:
          BACKEND_BASE_SHA: ${{ github.event.before }}
          BACKEND_HEAD_SHA: ${{ github.sha }}
          FORCE_BACKEND_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Skip non-runtime source change
        if: steps.impact.outputs.SHOULD_DEPLOY != 'true'
        run: echo "Aucune dépendance du runtime server.ts n'a changé ; aucun déploiement Cloud Run nécessaire."

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Build the immutable candidate image with Cloud Buildpacks
        id: image
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        run: |
          set -euo pipefail
          image_tag="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${GCP_SERVICE}:${GITHUB_SHA}"

          if ! gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format='value(name)' >/dev/null 2>&1; then
            echo "Création du dépôt Artifact Registry $GCP_ARTIFACT_REPOSITORY dans $GCP_REGION."
            gcloud artifacts repositories create "$GCP_ARTIFACT_REPOSITORY" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_REGION" \
              --repository-format=docker \
              --description='Images backend canoniques SeenIt construites par GitHub Actions' \
              --quiet
          fi

          gcloud artifacts repositories describe "$GCP_ARTIFACT_REPOSITORY" \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format='value(name)' >/dev/null

          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --pack "image=${image_tag}"

          digest="$(gcloud artifacts docker images describe "$image_tag" \
            --project "$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Digest Artifact Registry invalide pour $image_tag: ${digest:-absent}"
            exit 1
          fi

          image_uri="${image_tag%:*}@${digest}"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "Image candidate immuable: $image_uri"

      - name: Capture the currently served revision
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json)"
          previous_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.revisionName // "") != "")] | if length == 1 then .[0].revisionName else empty end' <<<"$service_json")"
          if [[ -z "$previous_revision" ]]; then
            echo "Le service canonique n'a pas exactement une révision à 100 % ; bascule automatique refusée."
            exit 1
          fi
          echo "PREVIOUS_REVISION=$previous_revision" >> "$GITHUB_ENV"
          echo "Révision actuellement servie: $previous_revision"

      - name: Deploy the candidate image without traffic
        id: deploy
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.GCP_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.image.outputs.uri }}
          no_traffic: true
          tag: candidate-${{ github.run_id }}

      - name: Health-check candidate, promote, and verify production
        if: steps.impact.outputs.SHOULD_DEPLOY == 'true'
        env:
          CANDIDATE_TAG: candidate-${{ github.run_id }}
        run: |
          set -euo pipefail

          verify_endpoint() {
            local base_url="$1"
            local label="$2"
            local attempt health_status release_status
            local body headers release_body
            body="$(mktemp)"
            headers="$(mktemp)"
            release_body="$(mktemp)"

            for attempt in $(seq 1 12); do
              : > "$body"
              : > "$headers"
              health_status="$(curl --silent --show-error --max-time 10 \
                --dump-header "$headers" \
                --output "$body" \
                --write-out '%{http_code}' \
                "$base_url/api/health" || true)"

              if [[ "$health_status" == '200' ]] \
                && jq -e '.status == "ok" and .service == "seenit-backend" and .identity == "canonical"' "$body" >/dev/null \
                && grep -qi '^x-seenit-backend:[[:space:]]*canonical' "$headers"; then
                : > "$release_body"
                release_status="$(curl --silent --show-error --max-time 10 \
                  --header 'content-type: application/json' \
                  --data '{}' \
                  --output "$release_body" \
                  --write-out '%{http_code}' \
                  "$base_url/api/releases/notify" || true)"
                if [[ "$release_status" == '403' ]] \
                  && jq -e '.success == false and .error == "untrusted_repository"' "$release_body" >/dev/null; then
                  echo "$label validé: health canonique + route /api/releases/notify active."
                  rm -f "$body" "$headers" "$release_body"
                  return 0
                fi
              fi

              echo "$label pas encore prêt (tentative $attempt/12, health=${health_status:-curl_error}, release=${release_status:-non_testee})."
              sleep 5
            done

            echo "$label invalide après retries."
            cat "$body" || true
            cat "$release_body" || true
            rm -f "$body" "$headers" "$release_body"
            return 1
          }

          candidate_revision=''
          candidate_url=''
          for attempt in $(seq 1 12); do
            service_json="$(gcloud run services describe "$GCP_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format=json)"
            candidate_revision="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag == $tag) | .revisionName // empty' <<<"$service_json" | head -n 1)"
            candidate_url="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag == $tag) | .url // empty' <<<"$service_json" | head -n 1)"
            if [[ -n "$candidate_revision" && -n "$candidate_url" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$candidate_revision" || -z "$candidate_url" ]]; then
            echo "Impossible de résoudre la révision candidate taguée $CANDIDATE_TAG. Aucun trafic n'a été basculé."
            exit 1
          fi

          echo "Candidate: revision=$candidate_revision git_sha=$GITHUB_SHA url=$candidate_url"
          verify_endpoint "$candidate_url" 'Révision candidate'

          gcloud run services update-traffic "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$candidate_revision=100" \
            --quiet

          if verify_endpoint "$CANONICAL_ORIGIN" 'Backend canonique'; then
            echo "Déploiement backend confirmé: git_sha=$GITHUB_SHA revision=$candidate_revision"
            exit 0
          fi

          echo "Le smoke après bascule a échoué. Rollback vers $PREVIOUS_REVISION."
          gcloud run services update-traffic "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$PREVIOUS_REVISION=100" \
            --quiet
          verify_endpoint "$CANONICAL_ORIGIN" 'Backend après rollback' || true
          exit 1
