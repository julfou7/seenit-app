name: Valider la restriction Git administrateur

on:
  push:
    branches:
      - fix/git-admin-issue11

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Installer
        run: npm ci --legacy-peer-deps

      - name: Appliquer le correctif
        run: python3 .github/scripts/fix-git-admin-issue11.py

      - name: Synchroniser la version
        run: npm run version:sync

      - name: Tester
        run: npm test

      - name: Auditer
        run: npm audit --omit=dev --audit-level=high

      - name: Construire
        run: npm run build

      - name: Vérifier Android avant sync
        run: npm run test:android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Vérifier Android après sync
        run: npm run test:android

      - name: Compiler APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Finaliser la branche
        shell: bash
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git rm .github/workflows/fix-git-admin-issue11.yml .github/scripts/fix-git-admin-issue11.py
          git add -A
          git commit -m "fix(sécurité): réserver les opérations Git aux administrateurs" -m "- protège status et pull Git avec une allowlist SEENIT_ADMIN_UIDS strictement côté serveur
          - refuse tout accès lorsque l’allowlist est absente et renvoie un 403 générique aux non-administrateurs
          - masque les outils Git dans la PWA et l’APK tant que le serveur n’a pas confirmé l’autorisation
          - documente la variable d’environnement et renforce SEENIT-SECURITY-002 avec des tests unitaires et d’intégration
          - aligne SeenIt 1.4.89 et valide PWA, Capacitor, contrat Android et compilation APK"
          git push origin HEAD:fix/git-admin-issue11
