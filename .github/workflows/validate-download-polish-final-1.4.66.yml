name: Validate Download Polish Final 1.4.66

on:
  push:
    branches:
      - fix/download-polish-series-sync-1.4.66

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/download-polish-series-sync-1.4.66
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply final patch
        run: node scripts/patch-download-polish-final-1.4.66.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build Web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated final changes
        run: |
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "fix(downloads): fiabiliser le ciblage des épisodes" -m $'- attend les épisodes Sonarr après l’ajout d’une nouvelle série\n- monitore puis recherche strictement l’épisode demandé\n- propage aussi la suppression des intentions entre PWA et APK\n- conserve SeenIt 1.4.66'
          git push origin HEAD:fix/download-polish-series-sync-1.4.66
