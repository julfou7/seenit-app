name: Finalize relations contract 130

on:
  push:
    branches:
      - fix/media-relations-tvdb-exact-130
    paths:
      - .github/workflows/finalize-relations-contract-130.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/media-relations-tvdb-exact-130
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Appliquer la finalisation #130
        run: |
          set +e
          node scripts/finalize-relations-130.cjs
          echo "$?" > /tmp/finalize-status
          exit 0

      - name: Persister les transformations atteintes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/finalize-relations-contract-130.yml' ':!scripts/finalize-relations-130.cjs'
          if ! git diff --cached --quiet; then
            git commit -m "fix(media): appliquer la migration TMDB TVDB #130" -m "Changelog:
            - Migre les fiches vers les relations structurelles TMDB et TVDB.
            - Prépare le backend sécurisé et les TNR associés.

            Détails techniques:
            - état intermédiaire persistant pour diagnostiquer puis terminer la validation sur la branche #130."
            git push origin HEAD:fix/media-relations-tvdb-exact-130
          fi

      - name: Tests ciblés relations et sécurité
        run: node --test tests/mediaRelationsSpecification.test.ts tests/mediaRelations.test.ts tests/tvdbRelations.test.ts tests/mediaProviderSecurity.test.ts tests/backendDeploymentWorkflow.test.ts tests/providerSecretDeployment.test.ts

      - name: Contrat de changement
        run: npm run test:spec:changes

      - name: Validation complète
        run: npm test

      - name: Build production
        run: npm run build

      - name: Vérifier le diff
        run: git diff --check

      - name: Retirer l'outillage temporaire après validation
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-relations-contract-130.yml scripts/finalize-relations-130.cjs
          git commit -m "chore(media): retirer l'outillage temporaire #130"
          git push origin HEAD:fix/media-relations-tvdb-exact-130
