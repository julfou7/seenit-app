name: Finalize relations contract 130

on:
  push:
    branches:
      - fix/media-relations-tvdb-exact-130
    paths:
      - .github/workflows/finalize-relations-contract-130.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/media-relations-tvdb-exact-130
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: TNR SPEC relations
        run: node --test tests/mediaRelationsSpecification.test.ts

      - name: TNR runtime relations
        run: node --test tests/mediaRelations.test.ts

      - name: TNR TVDB exact
        run: node --test tests/tvdbRelations.test.ts

      - name: TNR sécurité fournisseurs
        run: node --test tests/mediaProviderSecurity.test.ts

      - name: TNR déploiement backend
        run: node --test tests/backendDeploymentWorkflow.test.ts

      - name: TNR Secret Manager
        run: node --test tests/providerSecretDeployment.test.ts

      - name: Contrat de changement
        run: npm run test:spec:changes

      - name: Validation complète
        run: npm test

      - name: Build production
        run: npm run build

      - name: Vérifier le diff
        run: git diff --check

      - name: Retirer l'outillage temporaire après validation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-relations-contract-130.yml scripts/finalize-relations-130.cjs scripts/finalize-relations-130-v2.cjs
          git commit -m "chore(media): retirer l'outillage temporaire #130"
          git push origin HEAD:fix/media-relations-tvdb-exact-130
