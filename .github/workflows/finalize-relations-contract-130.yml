name: Finalize relations contract 130

on:
  push:
    branches:
      - fix/media-relations-tvdb-exact-130
    paths:
      - .github/workflows/finalize-relations-contract-130.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/media-relations-tvdb-exact-130
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Appliquer la finalisation #130
        run: |
          set +e
          node scripts/finalize-relations-130.cjs
          script_status=$?
          set -e
          if [ "$script_status" -ne 0 ]; then
            echo "Le script s'est arrêté après ses transformations déjà appliquées ; les TNR ci-dessous déterminent si l'état obtenu est complet."
          fi

      - name: Tests ciblés relations et sécurité
        run: node --test tests/mediaRelationsSpecification.test.ts tests/mediaRelations.test.ts tests/tvdbRelations.test.ts tests/mediaProviderSecurity.test.ts tests/backendDeploymentWorkflow.test.ts tests/providerSecretDeployment.test.ts

      - name: Contrat de changement
        run: npm run test:spec:changes

      - name: Validation complète
        run: npm test

      - name: Build production
        run: npm run build

      - name: Vérifier le diff
        run: git diff --check

      - name: Committer la migration validée et retirer l'outillage temporaire
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-relations-contract-130.yml scripts/finalize-relations-130.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(media): finaliser les relations TMDB et TVDB #130" -m "Changelog:
          - Les fiches utilisent désormais l'ordre TMDB et les franchises/univers TVDB exacts, sans contenus similaires.
          - Les trois fournisseurs sont reliés au backend via Secret Manager sans secret dans l'application.

          Détails techniques:
          - verrouille les TNR d'identité, de déduplication et d'absence de fallback par titre ;
          - lie les secrets Cloud Run par secretKeyRef et documente l'accès runtime minimal."
          git push origin HEAD:fix/media-relations-tvdb-exact-130
