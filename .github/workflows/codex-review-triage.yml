name: Codex Review Triage

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seenit-codex-review-triage
  cancel-in-progress: false

jobs:
  triage:
    name: Materialize unresolved Codex findings
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       (github.event.review.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.review.user.login == 'chatgpt-codex-connector')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout canonical triage code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize unresolved Codex findings in Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/codex-review-triage.cjs
