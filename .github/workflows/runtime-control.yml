name: SeenIt Runtime Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: seenit-runtime-control
  cancel-in-progress: false

jobs:
  runtime_control:
    name: Runtime Control
    if: >-
      github.event.issue.number == 57 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/deploy-pwa'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
      issues: write

    steps:
      - name: Resolve canonical main and guard duplicate deploy
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          main_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA main invalide: ${main_sha:-absent}"
            exit 1
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-backend.yml/runs?branch=main&per_page=30")"

          jq -r '.workflow_runs[] | select(.event == "workflow_dispatch") | .id' <<<"$runs" \
            > "$RUNNER_TEMP/runtime-control-before-runs.txt"

          reusable="$(jq -c --arg sha "$main_sha" '
            [
              .workflow_runs[]
              | select(.event == "workflow_dispatch" and .head_sha == $sha)
              | select(
                  .status == "queued"
                  or .status == "in_progress"
                  or (.status == "completed" and .conclusion == "success")
                )
            ]
            | sort_by(.created_at)
            | reverse
            | .[0] // empty
          ' <<<"$runs")"

          if [[ -n "$reusable" ]]; then
            existing_id="$(jq -r '.id' <<<"$reusable")"
            existing_url="$(jq -r '.html_url' <<<"$reusable")"
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "existing_id=$existing_id" >> "$GITHUB_OUTPUT"
            echo "existing_url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "Un workflow_dispatch utilisable existe déjà pour main $main_sha: $existing_url"
          else
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
            echo "Aucun workflow_dispatch actif ou déjà vert pour main $main_sha."
          fi

      - name: Dispatch canonical full-image rebuild
        if: steps.guard.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-backend.yml/dispatches" \
            -f ref=main

      - name: Resolve exact deploy run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          SHOULD_DISPATCH: ${{ steps.guard.outputs.should_dispatch }}
          EXISTING_ID: ${{ steps.guard.outputs.existing_id }}
          EXISTING_URL: ${{ steps.guard.outputs.existing_url }}
        run: |
          set -euo pipefail

          if [[ "$SHOULD_DISPATCH" != 'true' ]]; then
            echo "run_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "run_url=$EXISTING_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            runs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-backend.yml/runs?branch=main&per_page=30")"

            while IFS='|' read -r run_id run_url; do
              [[ -n "$run_id" ]] || continue
              if ! grep -qx "$run_id" "$RUNNER_TEMP/runtime-control-before-runs.txt"; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
                echo "Deploy Canonical Backend identifié pour $MAIN_SHA: $run_url"
                exit 0
              fi
            done < <(jq -r --arg sha "$MAIN_SHA" '
              .workflow_runs[]
              | select(.event == "workflow_dispatch" and .head_sha == $sha)
              | "\(.id)|\(.html_url)"
            ' <<<"$runs")

            sleep 3
          done

          echo "Le workflow_dispatch a été demandé mais le run exact n'a pas été retrouvé dans les 30 secondes. Aucun redéclenchement aveugle."
          exit 1

      - name: Publish dispatch proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          RUN_URL: ${{ steps.resolve.outputs.run_url }}
        run: |
          set -euo pipefail
          body="Déploiement PWA canonique demandé pour \`main\` \`${MAIN_SHA}\` : ${RUN_URL}\n\nLe run \`Deploy Canonical Backend\` est un \`workflow_dispatch\` forcé : il reconstruit l'image Cloud Run complète (backend + frontend PWA). **Aucune APK n'est construite ou publiée par ce contrôleur.**"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/issues/57/comments" \
            -f body="$body" \
            >/dev/null
