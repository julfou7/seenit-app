name: Finalize Logout Progress Toast

on:
  push:
    branches: [ ux/logout-progress-toast ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/logout-progress-toast
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Add immediate logout feedback
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('src/screens/SettingsScreen.tsx')
          text = settings.read_text()
          old = """  const handleLogout = async () => {\n    localStorage.setItem('explicit_logout', 'true');\n    clearPlexCredentials(auth.currentUser?.uid);\n    usePlexAvailabilityStore.getState().clearCache();\n    await revokeCurrentDeviceNotifications();\n    await signOut(auth);\n  };"""
          new = """  const handleLogout = async () => {\n    showToast(\"Déconnexion en cours...\", \"info\");\n    localStorage.setItem('explicit_logout', 'true');\n    clearPlexCredentials(auth.currentUser?.uid);\n    usePlexAvailabilityStore.getState().clearCache();\n    await revokeCurrentDeviceNotifications();\n    await signOut(auth);\n  };"""
          if old not in text:
              raise SystemExit('handleLogout attendu introuvable')
          settings.write_text(text.replace(old, new, 1))

          test = Path('tests/logoutFeedback.test.ts')
          test.write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport test from 'node:test';\n\nconst source = readFileSync('src/screens/SettingsScreen.tsx', 'utf8');\nconst start = source.indexOf('const handleLogout = async () => {');\nconst end = source.indexOf('const triggerTestNotif', start);\nconst handler = source.slice(start, end);\n\ntest('la déconnexion affiche immédiatement un feedback avant les opérations asynchrones', () => {\n  const toast = handler.indexOf('showToast(\\\"Déconnexion en cours...\\\", \\\"info\\\")');\n  const revoke = handler.indexOf('await revokeCurrentDeviceNotifications()');\n  const signout = handler.indexOf('await signOut(auth)');\n\n  assert.ok(toast >= 0, 'le toast de déconnexion doit être présent');\n  assert.ok(revoke > toast, 'le toast doit précéder la révocation des notifications');\n  assert.ok(signout > toast, 'le toast doit précéder signOut');\n});\n""")
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate
        run: |
          npm test
          git diff --check

      - name: Commit small UX fix
        run: |
          git rm .github/workflows/logout-progress-toast.yml
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add src/screens/SettingsScreen.tsx tests/logoutFeedback.test.ts
          git commit -m "fix(ux): indique la déconnexion en cours"
          git push origin ux/logout-progress-toast
