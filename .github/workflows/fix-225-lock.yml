name: Fix 225 dependency lock

on:
  push:
    branches:
      - fix/225-npm-audit-security

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/225-npm-audit-security
          fetch-depth: 0

      - name: Check whether refresh is needed
        id: guard
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.multer ? 0 : 1)"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.needed == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Apply security dependency cleanup
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          delete pkg.dependencies.multer;
          delete pkg.devDependencies['@types/multer'];
          pkg.overrides = pkg.overrides || {};
          pkg.overrides.qs = '6.16.0';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const serverPath = 'server.ts';
          let server = fs.readFileSync(serverPath, 'utf8');
          server = server.replace('import multer from "multer";\n', '');
          server = server.replace('  const upload = multer();\n', '');
          fs.writeFileSync(serverPath, server);
          NODE

          npm install --package-lock-only --ignore-scripts --audit=false --fund=false
          npm ci --ignore-scripts --audit=false --fund=false
          npm audit --omit=dev --audit-level=high
          npm run lint
          git diff --check

      - name: Commit generated dependency lock
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.ts
          git commit -m "fix: retirer multer vulnérable et corriger qs (#225)" -m "Changelog: Renforcement de la sécurité du backend en supprimant une dépendance d'upload inutilisée et vulnérable."
          git push origin HEAD:fix/225-npm-audit-security
