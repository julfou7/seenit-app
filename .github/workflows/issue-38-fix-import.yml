name: Finalize Plex 1.4.105
on:
  push:
    branches:
      - issue-38-plex-unwatch
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-38-plex-unwatch
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Realign Plex library state runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/plex/syncPlex.ts')
          text = path.read_text()
          text = text.replace(
              "import { applyExplicitPlexUnwatch, mergePlexProgressMutation } from './plexProgressMerge';",
              "import { applyPlexLibraryWatchState, mergePlexProgressMutation } from './plexProgressMerge';"
          )
          text = text.replace('applyExplicitPlexUnwatch(current, state)', 'applyPlexLibraryWatchState(current, state)')
          path.write_text(text)
          PY
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: bash -n scripts/android-upgrade-smoke.sh
      - name: Commit validated candidate
        run: |
          git rm .github/workflows/issue-38-fix-import.yml .github/workflows/issue-38-ci-timeout-validate.yml
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "fix(plex): finalise le dé-vu et borne les smokes Android"
          git push origin issue-38-plex-unwatch
