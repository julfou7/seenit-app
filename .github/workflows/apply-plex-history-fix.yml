name: Apply Plex History Fix

on:
  push:
    branches: [ fix/plex-orphan-history-1.4.50 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/plex-orphan-history-1.4.50
          fetch-depth: 0

      - name: Apply targeted Plex patch
        run: node scripts/apply-plex-history-fix.cjs

      - name: Commit generated source changes
        run: |
          if git diff --quiet -- server.ts src/features/plex/syncPlex.ts; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/features/plex/syncPlex.ts
          git commit -m "fix(plex): enrichir les historiques sans ratingKey direct"
          git push origin HEAD:fix/plex-orphan-history-1.4.50
