name: Apply Explorer Filters Fix 128

on:
  push:
    branches:
      - fix/128-explorer-filters
    paths:
      - .github/workflows/fix-explorer-filters-128.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: fix/128-explorer-filters
          fetch-depth: 0

      - name: Apply targeted Explorer fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceOnce = (source, before, after, label) => {
            const first = source.indexOf(before);
            if (first < 0) throw new Error(`Motif introuvable: ${label}`);
            if (source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Motif non unique: ${label}`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          };

          const filterPath = 'src/components/FilterModal.tsx';
          let filter = fs.readFileSync(filterPath, 'utf8');
          filter = replaceOnce(
            filter,
            "import { Tv, Film, X, Sparkles, FileText, User, Ticket } from 'lucide-react';",
            "import { Tv, Film, X, Sparkles, FileText, User, Ticket, Trophy } from 'lucide-react';",
            'import Trophy'
          );
          filter = replaceOnce(
            filter,
            'className="fixed inset-0 z-[100] flex flex-col justify-end bg-black/60 backdrop-blur-sm animate-in fade-in duration-300"',
            'className="fixed inset-0 z-[200] flex flex-col justify-end bg-black/60 backdrop-blur-sm animate-in fade-in duration-300"',
            'z-index FilterModal'
          );
          const pepitesAnchor = "              <button\n                onClick={() => setActiveCategory('Pépites')}";
          const top100Button = [
            '              <button',
            "                onClick={() => setActiveCategory('Top 100')}",
            '                className={cn("px-4 py-2 rounded-full text-[13px] font-semibold flex items-center gap-1.5 transition-all border", activeCategory === \'Top 100\' ? "bg-[#E5A93D]/20 text-[#E5A93D] border-[#E5A93D]/50" : "bg-white/5 border-white/5 text-zinc-300 hover:bg-white/10")}',
            '              >',
            '                <Trophy size={14}/> Top 100',
            '              </button>',
            ''
          ].join('\n');
          filter = replaceOnce(filter, pepitesAnchor, top100Button + pepitesAnchor, 'bouton Top 100');
          fs.writeFileSync(filterPath, filter);

          const discoverPath = 'src/screens/DiscoverScreen.tsx';
          let discover = fs.readFileSync(discoverPath, 'utf8');
          discover = replaceOnce(
            discover,
            "  { id: 'title', label: 'Ordre alphabétique' },\n  { id: 'top100', label: 'Top 100' }",
            "  { id: 'title', label: 'Ordre alphabétique' }",
            'Top 100 dans SORT_OPTIONS'
          );
          discover = replaceOnce(
            discover,
            "useState<'popular' | 'rating' | 'date' | 'title' | 'top100'>('popular')",
            "useState<'popular' | 'rating' | 'date' | 'title'>('popular')",
            'type sortBy'
          );
          discover = replaceOnce(
            discover,
            "      if (sortBy === 'top100') {\n        list.sort((a: any, b: any) => (b.vote_average || 0) - (a.vote_average || 0));\n      } else if (sortBy !== 'popular') {",
            "      if (sortBy !== 'popular') {",
            'tri client top100'
          );
          fs.writeFileSync(discoverPath, discover);

          const referencePath = 'docs/specifications/functional-reference.md';
          let reference = fs.readFileSync(referencePath, 'utf8');
          reference = replaceOnce(
            reference,
            '- Tri Populaires, Mieux notés, Plus récents, Ordre alphabétique ou Top 100.',
            '- Le panneau « Type de contenu » permet notamment de choisir **Top 100** ; ce choix change de catégorie et ne constitue pas un tri.\n- Tri Populaires, Mieux notés, Plus récents ou Ordre alphabétique.',
            'référence fonctionnelle du tri'
          );
          fs.writeFileSync(referencePath, reference);

          const testSource = [
            "import assert from 'node:assert/strict';",
            "import { readFileSync } from 'node:fs';",
            "import test from 'node:test';",
            '',
            "const filterSource = readFileSync(new URL('../src/components/FilterModal.tsx', import.meta.url), 'utf8');",
            "const discoverSource = readFileSync(new URL('../src/screens/DiscoverScreen.tsx', import.meta.url), 'utf8');",
            "const bottomNavSource = readFileSync(new URL('../src/components/BottomNav.tsx', import.meta.url), 'utf8');",
            '',
            "test('Explorer place Top 100 dans le type de contenu et plus dans les tris', () => {",
            "  assert.match(filterSource, /setActiveCategory\\('Top 100'\\)/);",
            "  assert.match(filterSource, /<Trophy size=\\{14\\}\\/> Top 100/);",
            "  assert.match(discoverSource, /activeCategory === 'Top 100'/);",
            "  const sortOptions = discoverSource.match(/const SORT_OPTIONS = \\[([\\s\\S]*?)\\n\\];/);",
            "  assert.ok(sortOptions, 'SORT_OPTIONS doit rester déclarée');",
            "  assert.doesNotMatch(sortOptions[1], /top100|Top 100/i);",
            '});',
            '',
            "test('le panneau de filtres reste au-dessus de la navigation basse', () => {",
            "  const filterZ = Number(filterSource.match(/z-\\[(\\d+)\\]/)?.[1]);",
            "  const navZ = Number(bottomNavSource.match(/z-\\[(\\d+)\\]/)?.[1]);",
            "  assert.ok(Number.isFinite(filterZ) && Number.isFinite(navZ), 'les deux couches doivent avoir un z-index explicite');",
            "  assert.ok(filterZ > navZ, `FilterModal (z=${filterZ}) doit passer au-dessus de BottomNav (z=${navZ})`);",
            "  assert.match(filterSource, /Afficher les résultats/);",
            "  assert.match(filterSource, /safe-area-inset-bottom/);",
            '});',
            ''
          ].join('\n');
          fs.writeFileSync('tests/explorerFiltersPresentation.test.ts', testSource);
          NODE

      - name: Verify targeted scope
        shell: bash
        run: |
          rm .github/workflows/fix-explorer-filters-128.yml
          expected=$(printf '%s\n' \
            '.github/workflows/fix-explorer-filters-128.yml' \
            'docs/specifications/functional-reference.md' \
            'src/components/FilterModal.tsx' \
            'src/screens/DiscoverScreen.tsx' \
            'tests/explorerFiltersPresentation.test.ts' | sort)
          actual=$(git status --short | sed 's/^.. //' | sort)
          if [ "$actual" != "$expected" ]; then
            echo 'Périmètre inattendu :' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: corriger les filtres Explorer' \
            -m 'Changelog:' \
            -m '- Le bouton des filtres reste accessible au-dessus de la navigation et Top 100 rejoint les types de contenu.' \
            -m 'Détails techniques:' \
            -m '- Relève la modale au-dessus de la barre basse et retire Top 100 des tris sans changer sa logique de catégorie.' \
            -m 'Relatif à #128.'
          git push origin HEAD:fix/128-explorer-filters
