name: Patch Downloads 1.4.56

on:
  push:
    branches:
      - fix/downloads-identity-ui-1.4.56
    paths:
      - 'scripts/patch-downloads-1.4.56.cjs'
      - '.github/workflows/patch-downloads-1.4.56.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/downloads-identity-ui-1.4.56
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch
        run: node scripts/patch-downloads-1.4.56.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Tests
        run: npm run test:plex

      - name: Build web and server
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/downloads/downloadIdentity.ts \
            src/services/sonarrRadarr.ts \
            src/store/liveDownloadStore.ts \
            src/screens/DownloadsScreen.tsx \
            tests/downloadIdentity.test.ts \
            src/store/updateStore.ts \
            android/app/build.gradle
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(downloads): stabiliser l’identité et refaire le suivi" -m "- conserve les alias infohash v1/v2 des torrents hybrides\n- agrège les représentations *Arr et qBittorrent avant affichage\n- mémorise les identités apprises entre les polls\n- force une release interactive lorsque le média existe déjà\n- modernise les cartes, badges qualité et barre de progression\n- publie SeenIt 1.4.56"
          git push origin HEAD:fix/downloads-identity-ui-1.4.56
