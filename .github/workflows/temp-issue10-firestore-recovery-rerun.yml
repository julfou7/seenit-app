name: Validation finale issue 10 Firestore

on:
  push:
    branches:
      - fix/issue-10-firestore-recovery

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Rejouer le correctif avec le contrat IDBFactory actuel
        run: |
          awk '
            /^[[:space:]]*- name: Préparer le correctif Firestore IndexedDB$/ { found=1; next }
            found && /^[[:space:]]*run: \|$/ { capture=1; next }
            capture && /^[[:space:]]*- name: Installer les dépendances$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/temp-issue10-firestore-recovery.yml > /tmp/prepare-issue10.sh

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('/tmp/prepare-issue10.sh')
          text = p.read_text()
          text, count = re.subn(
              r"\ninterface IndexedDbFactoryWithListing extends IDBFactory \{\n  databases\?: \(\) => Promise<IndexedDbDatabaseInfoLike\[\]>;\n\}\n",
              "\n",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('Bloc IndexedDbFactoryWithListing introuvable')

          if 'factory: IndexedDbFactoryWithListing,' not in text:
              raise SystemExit('Type factory introuvable')
          text = text.replace('factory: IndexedDbFactoryWithListing,', 'factory: IDBFactory,', 1)

          marker = "if (typeof factory.databases !== 'function') return [expected];"
          if marker not in text:
              raise SystemExit('Garde databases() introuvable')
          text = text.replace(
              marker,
              "const listDatabases = (factory as IDBFactory & { databases?: () => Promise<IndexedDbDatabaseInfoLike[]> }).databases;\n    if (typeof listDatabases !== 'function') return [expected];",
              1
          )

          call = 'const databases = await factory.databases.call(factory);'
          if call not in text:
              raise SystemExit('Appel databases() introuvable')
          text = text.replace(call, 'const databases = await listDatabases.call(factory);', 1)

          cast = 'const factory = (options.indexedDbFactory ?? indexedDB) as IndexedDbFactoryWithListing;'
          if cast not in text:
              raise SystemExit('Cast factory introuvable')
          text = text.replace(cast, 'const factory = options.indexedDbFactory ?? indexedDB;', 1)
          p.write_text(text)
          PY

          bash /tmp/prepare-issue10.sh

          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/androidContract.test.ts')
          text = p.read_text()
          needle = "const require = createRequire(import.meta.url);\n"
          if needle not in text:
              raise SystemExit('Point d’insertion package.json introuvable')
          text = text.replace(
              needle,
              needle + "const packageJson = require('../package.json') as { version: string };\n",
              1
          )
          expected = "assert.equal(result.contract.applicationVersion, '1.4.82');"
          if expected not in text:
              raise SystemExit('Assertion de version figée introuvable')
          text = text.replace(
              expected,
              'assert.equal(result.contract.applicationVersion, packageJson.version);',
              1
          )
          p.write_text(text)
          PY
          git add tests/androidContract.test.ts
          git commit --amend --no-edit

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Contrat de changement SPEC
        env:
          SPEC_BASE_SHA: 9ef6ee2e31f69e28d575c8d65fc02e67e40e2cc2
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          npm run test:spec:changes

      - name: SPEC, contrat Android, TypeScript et tests
        run: npm test

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Build PWA et synchronisation Capacitor
        run: |
          npm run build
          npx cap sync android
          npm run test:android

      - name: Compiler l’APK de validation
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Finaliser la branche sans workflows temporaires
        run: |
          git rm .github/workflows/temp-issue10-firestore-recovery.yml .github/workflows/temp-issue10-firestore-recovery-rerun.yml
          git add android
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/issue-10-firestore-recovery
