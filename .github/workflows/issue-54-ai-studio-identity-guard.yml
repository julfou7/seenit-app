name: Issue 54 - Correctif permanent AI Studio

on:
  push:
    branches:
      - fix/issue-54-ai-studio-identity-guard

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-54-ai-studio-identity-guard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Appliquer le correctif durable
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Pattern introuvable dans {path}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # 1) Firebase Android devient un artefact généré et non un fichier fragile transporté par AI Studio.
          gitignore = read('.gitignore')
          if 'android/app/google-services.json' not in gitignore:
              gitignore += '\n# Généré depuis docs/specifications/android-contract.json ; AI Studio ne le transporte pas.\nandroid/app/google-services.json\n'
              write('.gitignore', gitignore)

          contract_path = Path('docs/specifications/android-contract.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          firebase = contract.setdefault('firebase', {})
          firebase.update({
              'projectId': 'gen-lang-client-0201895414',
              'firestoreDatabaseId': 'default',
              'androidPackageName': 'com.seenit.app',
              'androidMobileSdkAppId': '1:799043440232:android:729435c4ab36bc039275dd',
              'projectNumber': '799043440232',
              'storageBucket': 'gen-lang-client-0201895414.firebasestorage.app',
              'androidOauthClientId': '799043440232-opho46a7s7dhecfb0t55js78d83rjf49.apps.googleusercontent.com',
              'androidCertificateHash': '7427c6a9914d1fa8f0d3c871e271e35392747bbb',
              'webOauthClientId': '799043440232-i9s1l0jaerljg58v3oooleuemnhnim4o.apps.googleusercontent.com',
              'apiKey': 'AIzaSyAKjntYVwu1HR5MPOThktT4CoN9UOWxybY'
          })
          contract['requiredFiles'] = [p for p in contract.get('requiredFiles', []) if p != 'android/app/google-services.json']
          generated = list(contract.get('generatedFiles', []))
          if 'android/app/google-services.json' not in generated:
              generated.append('android/app/google-services.json')
          contract['generatedFiles'] = generated
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          materializer = r'''const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve(__dirname, '..');
          const contractPath = path.join(root, 'docs/specifications/android-contract.json');
          const googleServicesPath = path.join(root, 'android/app/google-services.json');
          const gradlewPath = path.join(root, 'android/gradlew');

          function materializeAndroidConfig() {
            const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
            const firebase = contract.firebase || {};
            const required = [
              'projectId', 'androidPackageName', 'androidMobileSdkAppId', 'projectNumber',
              'storageBucket', 'androidOauthClientId', 'androidCertificateHash',
              'webOauthClientId', 'apiKey'
            ];
            for (const key of required) {
              if (!firebase[key]) throw new Error(`Contrat Firebase Android incomplet : ${key}`);
            }

            const googleServices = {
              project_info: {
                project_number: String(firebase.projectNumber),
                project_id: String(firebase.projectId),
                storage_bucket: String(firebase.storageBucket)
              },
              client: [{
                client_info: {
                  mobilesdk_app_id: String(firebase.androidMobileSdkAppId),
                  android_client_info: { package_name: String(firebase.androidPackageName) }
                },
                oauth_client: [
                  {
                    client_id: String(firebase.androidOauthClientId),
                    client_type: 1,
                    android_info: {
                      package_name: String(firebase.androidPackageName),
                      certificate_hash: String(firebase.androidCertificateHash)
                    }
                  },
                  { client_id: String(firebase.webOauthClientId), client_type: 3 }
                ],
                api_key: [{ current_key: String(firebase.apiKey) }],
                services: {
                  appinvite_service: {
                    other_platform_oauth_client: [
                      { client_id: String(firebase.webOauthClientId), client_type: 3 }
                    ]
                  }
                }
              }],
              configuration_version: '1'
            };

            fs.mkdirSync(path.dirname(googleServicesPath), { recursive: true });
            fs.writeFileSync(googleServicesPath, `${JSON.stringify(googleServices, null, 2)}\n`, 'utf8');
            if (fs.existsSync(gradlewPath) && process.platform !== 'win32') {
              fs.chmodSync(gradlewPath, 0o755);
            }
            return { googleServicesPath, gradlewPath };
          }

          if (require.main === module) {
            materializeAndroidConfig();
            console.log('[Android Config] google-services.json matérialisé et gradlew normalisé.');
          }

          module.exports = { materializeAndroidConfig };
          '''
          write('scripts/materialize-android-config.cjs', materializer.replace('\n          ', '\n').lstrip())

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['postinstall'] = 'node scripts/patch-local-notifications.cjs && node scripts/materialize-android-config.cjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validator = read('scripts/validate-android-contract.cjs')
          if "materialize-android-config.cjs" not in validator:
              validator = validator.replace("const path = require('node:path');\n", "const path = require('node:path');\nconst { materializeAndroidConfig } = require('./materialize-android-config.cjs');\n", 1)
              validator = validator.replace("function validateAndroidContract() {\n", "function validateAndroidContract() {\n  materializeAndroidConfig();\n", 1)
              write('scripts/validate-android-contract.cjs', validator)

          # 2) Identité download : TMDB exact pour l'identité média, jamais de titre/release comme preuve.
          identity = read('src/features/downloads/downloadIdentity.ts')
          start = identity.index('/**\n * Rattache temporairement une demande SeenIt')
          end = identity.index('\nexport function normalizeDownloadRelease', start)
          new_attach = '''/**
 * Rattache temporairement une demande SeenIt au transfert qui vient juste
 * d'apparaître avant que *Arr/qBittorrent ne partagent un hash commun.
 * L'identité média exige un TMDB ID exact. Les titres, années, TVDB/IMDb et
 * noms de release ne peuvent jamais compenser un TMDB absent ou différent.
 */
export function canAttachRecentOptimisticRequest(
  request?: DownloadIdentityLike | null,
  remote?: DownloadIdentityLike | null,
  now = Date.now(),
  windowMs = 60_000
): boolean {
  if (!request?.isOptimistic || !remote) return false;
  if (request.mediaType && remote.mediaType && request.mediaType !== remote.mediaType) return false;
  if (!request.tmdbId || !remote.tmdbId || Number(request.tmdbId) !== Number(remote.tmdbId)) return false;

  const requestedAt = Number(request.addedAt || 0);
  const remoteAddedAt = Number(remote.addedAt || 0);
  if (!requestedAt || !remoteAddedAt) return false;
  if (requestedAt > now + 5_000 || remoteAddedAt > now + 5_000) return false;

  const delta = remoteAddedAt - requestedAt;
  if (delta < -5_000 || delta > windowMs) return false;

  if (request.mediaType === 'tv') {
    if (request.seasonNumber != null && remote.seasonNumber != null
        && Number(request.seasonNumber) !== Number(remote.seasonNumber)) return false;
    if (request.episodeNumber != null && remote.episodeNumber != null
        && Number(request.episodeNumber) !== Number(remote.episodeNumber)) return false;
  }

  const requestResolution = identityResolutionBucket(request);
  const remoteResolution = identityResolutionBucket(remote);
  if (requestResolution && remoteResolution && requestResolution !== remoteResolution) return false;

  return true;
}
'''
          identity = identity[:start] + new_attach + identity[end:]

          # Le fallback historique release + taille est supprimé intégralement.
          identity = re.sub(
              r"\nfunction normalizeMediaReleaseKey\([\s\S]*?\n}\n\nexport function sameLegacyPhysicalTransfer\([\s\S]*?\n}\n",
              '\n',
              identity,
              count=1
          )

          show_start = identity.index('/**\n * Recherche la fiche média correspondante')
          show_end = len(identity)
          new_match = '''/**
 * Recherche la fiche média correspondante dans la bibliothèque SeenIt.
 * Le TMDB ID est l'unique identité canonique acceptée pour ce rapprochement.
 * Aucun fallback TVDB, IMDb, titre, titre original, année ou release n'est autorisé.
 */
export function findMatchingShowForDownload<T extends ShowLike>(
  item?: {
    mediaType?: 'tv' | 'movie' | string;
    tmdbId?: number | string;
    tvdbId?: number | string;
    imdbId?: string;
    seriesTitle?: string;
    movieTitle?: string;
    title?: string;
    releaseTitle?: string;
  } | null,
  shows?: T[] | null
): T | undefined {
  if (!item?.tmdbId || !shows || shows.length === 0) return undefined;
  const mediaType = item.mediaType === 'movie' ? 'movie' : 'tv';
  return shows.find(show =>
    show.mediaType === mediaType
    && Boolean(show.tmdbId)
    && Number(show.tmdbId) === Number(item.tmdbId)
  );
}
'''
          identity = identity[:show_start] + new_match
          write('src/features/downloads/downloadIdentity.ts', identity)

          store = read('src/store/liveDownloadStore.ts')
          store = store.replace('  normalizeDownloadRelease,\n', '')
          store = store.replace('  sameLegacyPhysicalTransfer,\n', '')
          store = re.sub(
              r"function sameCanonicalMedia\(a: LiveDownloadItem, b: LiveDownloadItem\): boolean \{[\s\S]*?\n}\n",
              "function sameCanonicalMedia(a: LiveDownloadItem, b: LiveDownloadItem): boolean {\n  if (a.mediaType !== b.mediaType) return false;\n  return Boolean(a.tmdbId && b.tmdbId && Number(a.tmdbId) === Number(b.tmdbId));\n}\n",
              store,
              count=1
          )
          store = re.sub(r"\nfunction cleanMediaTitleForComparison\([\s\S]*?\n}\n", '\n', store, count=1)
          store = store.replace('  if (sameLegacyPhysicalTransfer(a, b)) return true;\n\n', '')
          store = re.sub(
              r"\n  // 2\. Corrélation optimiste par titre nettoyé[\s\S]*?\n  return false;\n}",
              '\n  return false;\n}',
              store,
              count=1
          )
          store = re.sub(
              r"  const sameCanonical = Boolean\(\n    cancelled\.tmdbId[\s\S]*?\n  \);\n",
              "  const sameCanonical = Boolean(\n    cancelled.tmdbId && remote.tmdbId && Number(cancelled.tmdbId) === Number(remote.tmdbId)\n  );\n",
              store,
              count=1
          )
          # Notifications média : TMDB uniquement ; les identités physiques restent séparées.
          store = re.sub(
              r"    if \(item\.tmdbId\) keys\.add\(`movie:tmdb:\$\{Number\(item\.tmdbId\)\}:\$\{quality\}`\);\n    else if \(item\.imdbId\)[^\n]*\n",
              "    if (item.tmdbId) keys.add(`movie:tmdb:${Number(item.tmdbId)}:${quality}`);\n",
              store,
              count=1
          )
          store = re.sub(
              r"    const canonical = item\.tmdbId \? `tmdb:\$\{Number\(item\.tmdbId\)\}` : item\.tvdbId \? `tvdb:\$\{Number\(item\.tvdbId\)\}` : '';",
              "    const canonical = item.tmdbId ? `tmdb:${Number(item.tmdbId)}` : '';",
              store,
              count=1
          )
          write('src/store/liveDownloadStore.ts', store)

          service = read('src/services/sonarrRadarr.ts')
          service = service.replace(', sameLegacyPhysicalTransfer, samePhysicalDownload', ', samePhysicalDownload')
          service = re.sub(
              r"export function matchShowDownload\([\s\S]*?\n}\n\nexport function matchMovieDownload",
              "export function matchShowDownload(\n  item: LiveDownloadItem,\n  tmdbId?: number | string,\n  _tvdbId?: number | string,\n  _showTitle?: string\n): boolean {\n  if (item.mediaType !== 'tv' || !tmdbId || !item.tmdbId) return false;\n  return Number(item.tmdbId) === Number(tmdbId);\n}\n\nexport function matchMovieDownload",
              service,
              count=1
          )
          # Supprime le bloc de fallback legacy qBit basé sur release+taille s'il existe.
          service = re.sub(
              r"\n\s*const legacyIndexes = merged[\s\S]*?\n\s*if \(legacyIndexes\.length === 1\) \{[\s\S]*?\n\s*}\n",
              '\n',
              service,
              count=1
          )
          write('src/services/sonarrRadarr.ts', service)

          # 3) TNR : anciens scénarios par titre deviennent explicitement interdits.
          tests = read('tests/downloadIdentity.test.ts')
          tests = tests.replace('  sameLegacyPhysicalTransfer,\n', '')
          for name in [
              'rattache un ancien doublon sans hash grâce à la release et la taille',
              'ne fusionne pas deux releases de tailles différentes',
              'deux vrais infohash différents ne sont jamais fusionnés par le fallback release + taille',
              'le fallback release accepte un identifiant Arr temporaire non-hash',
              'canAttachRecentOptimisticRequest rattache une demande optimiste même si tvdbId diffère mais que le titre concorde',
              'canAttachRecentOptimisticRequest ne rattache pas deux séries aux titres différents même si les identifiants sont absents'
          ]:
              pattern = rf"\ntest\('{re.escape(name)}'[\s\S]*?\n\}}\);\n"
              tests, count = re.subn(pattern, '\n', tests, count=1)

          tests = re.sub(
              r"test\('rattache le titre localisé à l’unique torrent apparu juste après la demande sans utiliser le nom'[\s\S]*?\n}\);",
              """test('SEENIT-IDENTITY-001 exige un TMDB ID exact pour rattacher une demande à un transfert', () => {
  const now = 1_700_000_020_000;
  const request = { isOptimistic: true, mediaType: 'movie' as const, tmdbId: 123, title: 'Titre français', quality: '1080p', addedAt: now - 15_000 };
  assert.equal(canAttachRecentOptimisticRequest(request, { mediaType: 'movie', title: 'English title', quality: '1080p', addedAt: now - 8_000 }, now), false);
  assert.equal(canAttachRecentOptimisticRequest(request, { mediaType: 'movie', tmdbId: 456, title: 'Titre français', quality: '1080p', addedAt: now - 8_000 }, now), false);
  assert.equal(canAttachRecentOptimisticRequest(request, { mediaType: 'movie', tmdbId: 123, title: 'Completely Different', quality: '1080p', addedAt: now - 8_000 }, now), true);
});""",
              tests,
              count=1
          )
          tests = re.sub(
              r"test\('la synchro partagée rattache un titre français à l’unique torrent anglais sans comparer les noms'[\s\S]*?\n}\);",
              """test('SEENIT-DOWNLOAD-001 la synchro partagée rattache uniquement le même TMDB malgré des titres différents', () => {
  const now = 1_700_000_320_000;
  const request = {
    id: 'opt_robin', requestId: 'opt_robin', isOptimistic: true, mediaType: 'movie' as const,
    tmdbId: 1181198, title: 'Titre français', quality: '1080p', addedAt: now - 12_000,
    size: 0, sizeleft: 0, progress: 0, status: 'searching', statusText: 'Recherche en cours'
  };
  const remote = {
    id: 'radarr_robin', mediaType: 'movie' as const, tmdbId: 1181198,
    title: 'A Totally Different Release Name', quality: '1080p WEB-DL', addedAt: now - 6_000,
    size: 2_300_000_000, sizeleft: 2_300_000_000, progress: 0,
    status: 'downloading', statusText: 'Téléchargement en cours'
  };
  assert.deepEqual(findUniqueRecentOptimisticAttachments([request], [remote], now), [{ requestIndex: 0, remoteIndex: 0 }]);
  assert.deepEqual(findUniqueRecentOptimisticAttachments([request], [{ ...remote, tmdbId: undefined }], now), []);
});""",
              tests,
              count=1
          )
          write('tests/downloadIdentity.test.ts', tests)

          poster = read('tests/downloadPosterStability.test.ts')
          poster = re.sub(
              r"test\('findMatchingShowForDownload retrouve la fiche série par tmdbId, tvdbId ou titre normalisé'[\s\S]*?\n}\);\n",
              """test('SEENIT-IDENTITY-001 rattache un téléchargement SeenIt uniquement par TMDB ID', async () => {
  const { findMatchingShowForDownload } = await import('../src/features/downloads/downloadIdentity.ts');
  const libraryShows = [{ mediaType: 'tv' as const, tmdbId: 218738, tvdbId: 423527, title: 'Dark Matter', posterPath: '/fiche.jpg' }];

  assert.equal(findMatchingShowForDownload({ mediaType: 'tv', tmdbId: 218738, seriesTitle: 'Un autre titre' }, libraryShows)?.posterPath, '/fiche.jpg');
  assert.equal(findMatchingShowForDownload({ mediaType: 'tv', tmdbId: 999999, seriesTitle: 'Dark Matter' }, libraryShows), undefined);
  assert.equal(findMatchingShowForDownload({ mediaType: 'tv', tvdbId: 423527, seriesTitle: 'Dark Matter' }, libraryShows), undefined);
  assert.equal(findMatchingShowForDownload({ mediaType: 'tv', seriesTitle: 'Dark Matter' }, libraryShows), undefined);
});
""",
              poster,
              count=1
          )
          write('tests/downloadPosterStability.test.ts', poster)

          guard_test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const read = (path: string) => fs.readFileSync(path, 'utf8');

          test('SEENIT-DOWNLOAD-001 interdit durablement tout fallback d’identité par titre ou release', () => {
            const identity = read('src/features/downloads/downloadIdentity.ts');
            const store = read('src/store/liveDownloadStore.ts');
            const service = read('src/services/sonarrRadarr.ts');
            assert.equal(identity.includes('sameLegacyPhysicalTransfer'), false);
            assert.equal(store.includes('cleanMediaTitleForComparison'), false);
            assert.equal(store.includes('sameLegacyPhysicalTransfer'), false);
            assert.equal(service.includes('sameLegacyPhysicalTransfer'), false);
            assert.match(identity, /!request\.tmdbId \|\| !remote\.tmdbId/);
            assert.match(identity, /if \(!item\?\.tmdbId/);
          });
          '''
          write('tests/downloadTitleIdentityGuard.test.ts', guard_test.replace('\n          ', '\n').lstrip())

          firebase_test = read('tests/firebaseIdentityGuardrails.test.ts')
          firebase_test = firebase_test.replace("import fs from 'node:fs';\n", "import fs from 'node:fs';\nimport { execFileSync } from 'node:child_process';\n")
          firebase_test = re.sub(
              r"test\('SEENIT-APK-004 protège l’identité Firebase Android canonique'[\s\S]*?\n}\);",
              """test('SEENIT-APK-004 protège l’identité Firebase Android canonique générée', () => {
  execFileSync(process.execPath, ['scripts/materialize-android-config.cjs']);
  const contract = JSON.parse(read('docs/specifications/android-contract.json'));
  const googleServices = JSON.parse(read('android/app/google-services.json'));
  const gitignore = read('.gitignore');
  assert.match(gitignore, /android\\/app\\/google-services\\.json/);
  assert.ok(contract.generatedFiles.includes('android/app/google-services.json'));
  assert.equal(contract.requiredFiles.includes('android/app/google-services.json'), false);
  assert.equal(googleServices.project_info.project_id, contract.firebase.projectId);
  const client = googleServices.client.find((item: any) => item?.client_info?.android_client_info?.package_name === contract.firebase.androidPackageName);
  assert.ok(client, 'le client Firebase Android SeenIt doit être matérialisé');
  assert.equal(client.client_info.mobilesdk_app_id, contract.firebase.androidMobileSdkAppId);
});""",
              firebase_test,
              count=1
          )
          firebase_test = re.sub(
              r"test\('SEENIT-QUALITY-005 protège les fichiers Android suivis et les droits exécutables'[\s\S]*?\n}\);",
              """test('SEENIT-QUALITY-005 matérialise Firebase Android et répare les droits Gradle', () => {
  execFileSync(process.execPath, ['scripts/materialize-android-config.cjs']);
  assert.equal(fs.existsSync('android/app/google-services.json'), true, 'google-services.json doit être généré');
  assert.equal(fs.existsSync('android/app/debug.keystore'), true, 'la clé de signature historique doit rester suivie');
  if (process.platform !== 'win32') {
    assert.notEqual(fs.statSync('android/gradlew').mode & 0o111, 0, 'le matérialiseur doit rendre android/gradlew exécutable');
  }
});""",
              firebase_test,
              count=1
          )
          write('tests/firebaseIdentityGuardrails.test.ts', firebase_test)

          # 4) Gouvernance + SPEC + catalogue + registre durable.
          agents = read('AGENTS.md')
          agents = agents.replace(
              "- `android/app/google-services.json` reste présent avec le package `com.seenit.app` et son identité\n  Firebase Android canonique.\n",
              "- `android/app/google-services.json` est un artefact généré et git-ignoré, matérialisé depuis\n  `docs/specifications/android-contract.json` ; AI Studio ne doit jamais en être la source.\n- `android/gradlew` est normalisé exécutable par le matérialiseur Android avant les contrôles/builds.\n"
          )
          anchor = "## 6. PWA et APK\n"
          rule = """## 5.1 Identité média des téléchargements\n\n- **TMDB ID est l’unique identité canonique** pour rattacher une fiche SeenIt à un téléchargement.\n- TVDB/IMDb peuvent être transportés comme métadonnées, mais doivent être résolus vers TMDB avant toute association média.\n- Titre, titre original, année, nom de fichier et nom de release ne sont **jamais** des clés de matching.\n- Un même transfert physique se reconnaît uniquement par `requestId`, infohash/downloadId/alias exact ou chemin de transfert exact ; en cas d’ambiguïté, ne pas fusionner.\n\n"""
          if rule not in agents:
              agents = agents.replace(anchor, rule + anchor)
          write('AGENTS.md', agents)

          spec = read('docs/specifications/seenit.md')
          old_apk4 = """- **SEENIT-APK-004** — L'identité Firebase Android est immuable au même titre que l'identité APK :\n  `android/app/google-services.json` reste présent, son `project_id` reste `gen-lang-client-0201895414`,\n  son package reste `com.seenit.app` et son `mobilesdk_app_id` reste celui de l'application SeenIt\n  actuellement publiée. Le contrat Android vérifie ces valeurs en lisant réellement le JSON. Toute\n  modification est une migration Firebase Android explicite, jamais un effet secondaire d'import.\n  La CI exécute ce contrat avant le garde d'immuabilité de release afin qu'une dérive native issue\n  d'un import soit diagnostiquée précisément. Avant Gradle, elle restaure explicitement le droit\n  d'exécution de `android/gradlew` : une normalisation de mode de fichier par AI Studio ou un\n  connecteur Windows ne peut plus bloquer le build.\n"""
          new_apk4 = """- **SEENIT-APK-004** — L'identité Firebase Android est immuable au même titre que l'identité APK.\n  `docs/specifications/android-contract.json` est la source canonique suivie ; `android/app/google-services.json`\n  est git-ignoré et matérialisé de façon déterministe avant les contrôles/builds avec le `project_id`\n  `gen-lang-client-0201895414`, le package `com.seenit.app` et le `mobilesdk_app_id` publié. Une suppression\n  ou régénération AI Studio ne peut donc plus devenir une migration implicite. Le même matérialiseur\n  normalise `android/gradlew` exécutable avant validation/Gradle. Toute modification des valeurs canoniques\n  du contrat reste une migration Firebase Android explicite et testée.\n"""
          if old_apk4 not in spec:
              raise SystemExit('Bloc SEENIT-APK-004 introuvable')
          spec = spec.replace(old_apk4, new_apk4, 1)
          spec = spec.replace(
              "- **SEENIT-IDENTITY-001** — Une identité de film ou série ne peut être établie qu'avec un ID\n  technique vérifié : TMDB en priorité, puis TVDB/IMDb résolu explicitement vers TMDB quand\n  nécessaire. Le titre, l'année, la popularité ou la position d'un résultat ne sont jamais une\n  preuve d'identité.\n- Les noms de release peuvent servir uniquement à reconnaître deux représentations du même\n  transfert si une preuve physique supplémentaire existe (infohash, downloadId, chemin ou\n  taille quasi identique). Ils ne créent jamais une identité média.\n",
              "- **SEENIT-IDENTITY-001** — Une identité de film ou série SeenIt est canonique par **TMDB ID**.\n  TVDB/IMDb peuvent exister comme métadonnées techniques, mais doivent être résolus vers TMDB avant\n  toute association média. Le titre, le titre original, l'année, la popularité, le nom de fichier,\n  le nom de release ou la position d'un résultat ne sont jamais une preuve d'identité.\n- Pour les téléchargements, un transfert physique ne se fusionne que par `requestId`, infohash/downloadId\n  ou alias exact, ou chemin de transfert exact. Une taille, un titre ou un nom de release, même combinés,\n  ne suffisent jamais ; une ambiguïté reste non résolue.\n",
              1
          )
          spec = spec.replace(
              "- **SEENIT-DOWNLOAD-001** — Une intention SeenIt et un transfert distant ne sont jamais reliés\n  par titre. Un qBittorrent sans ID reste visible lorsqu'un seul rattachement technique est\n  possible et est masqué temporairement quand plusieurs intentions sont compatibles.\n",
              "- **SEENIT-DOWNLOAD-001** — Une intention SeenIt et un transfert distant ne sont jamais reliés\n  par titre, titre original, année ou nom de release. L'association média requiert un **TMDB ID exact** ;\n  TVDB/IMDb seuls ne suffisent pas. La corrélation d'un même transfert sans TMDB n'est permise que par\n  une preuve physique exacte (`requestId`, infohash/downloadId/alias ou chemin). Sinon le transfert reste\n  visible et non rattaché plutôt que produire un faux positif.\n",
              1
          )
          write('docs/specifications/seenit.md', spec)

          req_path = Path('docs/specifications/requirements.json')
          req = json.loads(req_path.read_text(encoding='utf-8'))
          by_id = {item['id']: item for item in req['requirements']}
          by_id['SEENIT-APK-004']['title'] = 'Identité Firebase Android matérialisée depuis le contrat canonique'
          by_id['SEENIT-APK-004']['tests'] = [
              {'file': 'tests/firebaseIdentityGuardrails.test.ts', 'contains': 'SEENIT-APK-004 protège l’identité Firebase Android canonique générée'},
              {'file': 'tests/developmentGovernance.test.ts', 'contains': 'SEENIT-APK-004 exécute le contrat Android avant le garde de release'},
              {'file': 'tests/developmentGovernance.test.ts', 'contains': 'SEENIT-APK-004 restaure le droit d’exécution Gradle avant le build'}
          ]
          by_id['SEENIT-IDENTITY-001']['tests'].append(
              {'file': 'tests/downloadPosterStability.test.ts', 'contains': 'SEENIT-IDENTITY-001 rattache un téléchargement SeenIt uniquement par TMDB ID'}
          )
          by_id['SEENIT-DOWNLOAD-001']['title'] = 'Réconciliation download sans titre, ancrée sur TMDB ou preuve physique exacte'
          existing = by_id['SEENIT-DOWNLOAD-001'].setdefault('tests', [])
          existing.extend([
              {'file': 'tests/downloadIdentity.test.ts', 'contains': 'SEENIT-DOWNLOAD-001 la synchro partagée rattache uniquement le même TMDB malgré des titres différents'},
              {'file': 'tests/downloadTitleIdentityGuard.test.ts', 'contains': 'SEENIT-DOWNLOAD-001 interdit durablement tout fallback d’identité par titre ou release'}
          ])
          # Déduplique les références si le workflow est rejoué.
          for item in req['requirements']:
              seen = set(); dedup = []
              for test_ref in item.get('tests', []):
                  key = (test_ref.get('file'), test_ref.get('contains'))
                  if key not in seen:
                      seen.add(key); dedup.append(test_ref)
              item['tests'] = dedup
          req_path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry = read('docs/requests/registry.md')
          row = "| USR-2026-09-02-009 | 2026-09-02 | L’identité média des téléchargements SeenIt utilise exclusivement le TMDB ID ; titre, titre original, année et release ne servent jamais au matching. `google-services.json` devient un artefact Android généré depuis le contrat canonique afin qu’un transport AI Studio ne puisse plus imposer de restauration manuelle. | `SEENIT-IDENTITY-001`, `SEENIT-DOWNLOAD-001`, `SEENIT-APK-004`, [issue #54](https://github.com/julfou7/seenit-app/issues/54) | active |\n"
          if 'USR-2026-09-02-009' not in registry:
              registry = registry.rstrip() + '\n' + row
          write('docs/requests/registry.md', registry)
          PY

      - name: Restaurer le mode Gradle et matérialiser Android
        run: |
          node scripts/materialize-android-config.cjs
          chmod +x android/gradlew
          git update-index --chmod=+x android/gradlew

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier l'absence de matching par titre
        run: |
          if grep -R "sameLegacyPhysicalTransfer\|cleanMediaTitleForComparison" src; then
            echo "Un fallback par titre/release subsiste" >&2
            exit 1
          fi

      - name: Tests et build
        run: |
          npm test
          npm run build

      - name: Commit du correctif
        run: |
          rm .github/workflows/issue-54-ai-studio-identity-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(identity): verrouiller TMDB et le transport Android" -m "- interdit tout matching média par titre/release et exige TMDB pour les associations SeenIt" -m "- génère google-services.json depuis le contrat et normalise gradlew automatiquement" -m "- renforce SPEC, gouvernance et TNR pour empêcher la régression AI Studio"
          git push origin HEAD:fix/issue-54-ai-studio-identity-guard
