name: Issue 54 - Correctif permanent AI Studio

on:
  push:
    branches:
      - fix/issue-54-ai-studio-identity-guard

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-54-ai-studio-identity-guard
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Appliquer le correctif durable
        run: |
          python3 scripts/issue54_patch.py
          sed -i 's/ || sameLegacyPhysicalTransfer(localMatch, serverItem)//' src/store/liveDownloadStore.ts
          sed -i '/const legacyIndexes: number\[\] = \[\];/d' src/services/sonarrRadarr.ts
          perl -0pi -e 's/\n\s*\/\/ Fallback ancien\/transitoire[^\n]*\n\s*\/\/ deux vrais infohash incompatibles[^\n]*\n\s*\/\/ bloque plus le rattachement[^\n]*\n\s*if \(sameLegacyPhysicalTransfer\(it, qbitProbe\)\) \{\n\s*legacyIndexes\.push\(index\);\n\s*\}//s' src/services/sonarrRadarr.ts
          sed -i 's/const matchingIndexes = exactIndexes.length > 0 ? exactIndexes : legacyIndexes;/const matchingIndexes = exactIndexes;/' src/services/sonarrRadarr.ts

      - name: Restaurer le mode Gradle et matérialiser Android
        run: |
          node scripts/materialize-android-config.cjs
          chmod +x android/gradlew
          git update-index --chmod=+x android/gradlew

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier l'absence de matching par titre
        run: |
          if grep -R "sameLegacyPhysicalTransfer\|cleanMediaTitleForComparison" src; then
            echo "Un fallback par titre/release subsiste" >&2
            exit 1
          fi

      - name: Tests et build
        run: |
          npm test
          npm run build

      - name: Commit du correctif
        run: |
          rm .github/workflows/issue-54-ai-studio-identity-guard.yml
          rm scripts/issue54_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(identity): verrouiller TMDB et le transport Android" -m "- interdit tout matching média par titre/release et exige TMDB pour les associations SeenIt" -m "- génère google-services.json depuis le contrat et normalise gradlew automatiquement" -m "- renforce SPEC, gouvernance et TNR pour empêcher la régression AI Studio"
          git push origin HEAD:fix/issue-54-ai-studio-identity-guard
