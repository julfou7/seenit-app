name: Finalize SeenIt Native Google Auth

on:
  push:
    branches: [ issue-40-native-google-auth ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-40-native-google-auth
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Implement Credential Manager auth like ATHIA
        run: |
          python scripts/issue-40-finalize.py
          sed -i 's/### SEENIT-AUTH-001/### **SEENIT-AUTH-001**/' docs/specifications/seenit.md

      - name: Align SeenIt 1.4.109
        run: npm run version:sync

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate candidate
        run: |
          npm test
          npm run build
          npx cap sync android
          npm run test:android
          git diff --check

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile Android native auth
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Commit validated implementation
        run: |
          git rm .github/workflows/issue-40-finalize.yml scripts/issue-40-finalize.py
          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add -A
          git commit -m "feat(auth): adopte la mire Google native ATHIA"
          git push origin issue-40-native-google-auth
