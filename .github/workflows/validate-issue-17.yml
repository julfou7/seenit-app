name: Validation temporaire issue 17

on:
  push:
    branches:
      - fix/issue-17-assainissement-repo-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Synchroniser la version et le lockfile
        run: |
          npm run version:sync
          npm install --package-lock-only --legacy-peer-deps

      - name: Publier uniquement les fichiers générés sur la branche de travail
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle src/store/updateStore.ts server.ts package.json package-lock.json docs/specifications/requirements.json docs/specifications/android-contract.json docs/specifications/seenit.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(version): aligner SeenIt en 1.4.98"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recharger après synchronisation
        if: steps.sync.outputs.changed == 'true'
        run: git fetch origin "${GITHUB_REF_NAME}" && git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Installer depuis le lockfile synchronisé
        run: npm ci --legacy-peer-deps

      - name: Classifier la livraison
        run: npm run delivery:classify
        env:
          DELIVERY_BASE_SHA: ${{ github.event.before }}
          FORCED_DELIVERY_MODE: auto

      - name: Vérifier la SPEC, Android, TypeScript et les tests
        run: npm test

      - name: Auditer les dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Construire la PWA et le backend
        run: npm run build

      - name: Synchroniser Capacitor Android
        run: npx cap sync android

      - name: Revalider le contrat Android après sync
        run: npm run test:android

      - name: Préparer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compiler les APK de validation
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
