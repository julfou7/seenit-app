name: Validate AI Studio Firebase guardrails

on:
  push:
    branches: [ chore/ai-studio-firebase-guardrails ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate specification change contract
        run: npm run test:spec:changes
        env:
          SPEC_BASE_SHA: f9626da59af96d5209431366d56d811656f98291
      - name: Validate Android contract before sync
        run: npm run test:android
      - name: Run all tests
        run: npm test
      - name: Build web and backend
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Validate Android contract after sync
        run: npm run test:android
