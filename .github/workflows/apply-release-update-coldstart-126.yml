name: Apply APK Release Push Cold Start 126

on:
  push:
    branches:
      - feat/126-apk-release-push
    paths:
      - .github/workflows/apply-release-update-coldstart-126.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/126-apk-release-push
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply cold-start notification handling
        run: node scripts/apply-release-update-coldstart-126.cjs

      - name: Remove bootstrap files from final diff
        run: rm .github/workflows/apply-release-update-coldstart-126.yml scripts/apply-release-update-coldstart-126.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Validate specification
        run: npm run test:spec

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Android contract
        run: npm run test:android

      - name: Build Web and server
        run: npm run build

      - name: Verify final changed paths
        shell: bash
        run: |
          unexpected="$(git status --short | sed 's/^.. //' | grep -vE '^(\.github/workflows/apply-release-update-coldstart-126\.yml|scripts/apply-release-update-coldstart-126\.cjs|src/App\.tsx|src/lib/firebase\.ts|src/features/release/releaseUpdatePushClient\.ts|tests/releaseUpdatePushClient\.test\.ts|tests/releaseUpdatePushWorkflow\.test\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Fichiers inattendus:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit cold-start fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix(update): conserver le clic push au démarrage' \
            -m 'Changelog:' \
            -m '- Toucher l’alerte de mise à jour ouvre correctement SeenIt même après un démarrage à froid.' \
            -m 'Détails techniques:' \
            -m '- Mémorise au plus une action APP_UPDATE_AVAILABLE jusqu’au montage de MainApp puis la consomme une seule fois.' \
            -m '- Ajoute un TNR du chemin Capacitor avant montage React.' \
            -m 'Relatif à #126.'
          git push origin HEAD:feat/126-apk-release-push
