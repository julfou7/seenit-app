name: Apply APK Release Push 126

on:
  push:
    branches:
      - feat/126-apk-release-push
    paths:
      - .github/workflows/apply-release-update-push-126.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/126-apk-release-push
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply backend, client and specification integration
        run: node scripts/apply-release-update-push-126.cjs

      - name: Remove bootstrap files from final diff
        run: rm .github/workflows/apply-release-update-push-126.yml scripts/apply-release-update-push-126.cjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Validate specification
        run: npm run test:spec

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Android contract
        run: npm run test:android

      - name: Build Web and server
        run: npm run build

      - name: Verify final changed paths
        shell: bash
        run: |
          unexpected="$(git status --short | sed 's/^.. //' | grep -vE '^(\.github/workflows/apply-release-update-push-126\.yml|scripts/apply-release-update-push-126\.cjs|server\.ts|src/App\.tsx|docs/specifications/seenit\.md|docs/specifications/functional-reference\.md|docs/specifications/requirements\.json|docs/process/delivery\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Fichiers inattendus:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit integrated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(update): notifier Android après publication APK' \
            -m 'Changelog:' \
            -m '- SeenIt prévient désormais les appareils Android autorisés lorsqu’une nouvelle APK officielle est disponible.' \
            -m '- Toucher l’alerte ouvre l’application et vérifie la mise à jour officielle avant toute installation.' \
            -m 'Détails techniques:' \
            -m '- Revalide côté backend le run GitHub, le tag, les assets et le SHA-256 avant FCM.' \
            -m '- Sérialise la diffusion par version/installation et borne les reprises sans cibler la PWA.' \
            -m 'Relatif à #126.'
          git push origin HEAD:feat/126-apk-release-push