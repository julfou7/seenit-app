name: Issue 54 - Déclenche release 1.4.110

on:
  push:
    branches:
      - fix/issue-54-ai-studio-identity-guard

permissions:
  actions: write
  contents: write

jobs:
  dispatch-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-54-ai-studio-identity-guard
          fetch-depth: 0

      - name: Déclencher la release officielle depuis main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/dispatches" \
            -d '{"ref":"main","inputs":{"release_apk":"true","android12_smoke":"false"}}'

      - name: Retirer le workflow temporaire
        run: |
          rm .github/workflows/issue-54-dispatch-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: retire le déclencheur temporaire de release #54"
          git push origin HEAD:fix/issue-54-ai-studio-identity-guard
