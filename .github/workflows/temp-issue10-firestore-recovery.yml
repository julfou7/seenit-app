name: Validation temporaire issue 10 Firestore

on:
  push:
    branches:
      - fix/issue-10-firestore-recovery

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Préparer le correctif Firestore IndexedDB
        run: |
          cat > src/lib/firestoreRecovery.ts <<'EOF'
          export const FIRESTORE_RECOVERY_WINDOW_MS = 5 * 60 * 1000;
          export const FIRESTORE_RECOVERY_STORAGE_KEY = 'seenit_firestore_recovery_v1';
          export const FIRESTORE_RECOVERY_DIAGNOSTIC_ID = 'seenit-firestore-recovery-diagnostic';

          export type FirestoreRecoveryPhase = 'prepare' | 'reload' | 'failed';
          export type FirestoreRecoveryDecision = 'attempt' | 'follow' | 'stop';

          export interface FirestoreRecoveryConfig {
            projectId: string;
            databaseId: string;
          }

          export interface FirestoreRecoveryState extends FirestoreRecoveryConfig {
            version: 1;
            attemptId: string;
            startedAt: number;
            phase: FirestoreRecoveryPhase;
          }

          export interface IndexedDbDatabaseInfoLike {
            name?: string;
          }

          interface IndexedDbFactoryWithListing extends IDBFactory {
            databases?: () => Promise<IndexedDbDatabaseInfoLike[]>;
          }

          export function buildFirestoreIndexedDbName(
            projectId: string,
            databaseId: string,
            persistenceKey = '[DEFAULT]'
          ): string {
            const databaseSegment = databaseId === '(default)'
              ? projectId
              : `${projectId}.${databaseId}`;
            return `firestore/${persistenceKey}/${databaseSegment}/main`;
          }

          export function selectCurrentFirestoreDatabaseNames(
            databases: IndexedDbDatabaseInfoLike[],
            config: FirestoreRecoveryConfig
          ): string[] {
            const expected = buildFirestoreIndexedDbName(config.projectId, config.databaseId);
            return databases
              .map(database => database.name)
              .filter((name): name is string => name === expected);
          }

          export function parseFirestoreRecoveryState(raw: string | null): FirestoreRecoveryState | null {
            if (!raw) return null;
            try {
              const value = JSON.parse(raw) as Partial<FirestoreRecoveryState>;
              if (
                value.version !== 1 ||
                typeof value.projectId !== 'string' ||
                typeof value.databaseId !== 'string' ||
                typeof value.attemptId !== 'string' ||
                typeof value.startedAt !== 'number' ||
                !['prepare', 'reload', 'failed'].includes(String(value.phase))
              ) {
                return null;
              }
              return value as FirestoreRecoveryState;
            } catch {
              return null;
            }
          }

          export function decideFirestoreRecovery(
            existing: FirestoreRecoveryState | null,
            now: number,
            config: FirestoreRecoveryConfig
          ): FirestoreRecoveryDecision {
            if (!existing) return 'attempt';
            if (existing.projectId !== config.projectId || existing.databaseId !== config.databaseId) {
              return 'attempt';
            }
            if (now - existing.startedAt >= FIRESTORE_RECOVERY_WINDOW_MS) {
              return 'attempt';
            }
            return existing.phase === 'prepare' ? 'follow' : 'stop';
          }

          export function isFirestoreIndexedDbCorruption(reason: unknown): boolean {
            const message = typeof reason === 'string'
              ? reason
              : typeof (reason as { message?: unknown } | null)?.message === 'string'
                ? String((reason as { message: string }).message)
                : '';
            return message.includes('INTERNAL ASSERTION FAILED');
          }

          function sameRecoveryTarget(
            state: FirestoreRecoveryState | null,
            config: FirestoreRecoveryConfig
          ): state is FirestoreRecoveryState {
            return Boolean(
              state &&
              state.projectId === config.projectId &&
              state.databaseId === config.databaseId
            );
          }

          function createAttemptId(): string {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
              return crypto.randomUUID();
            }
            return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
          }

          function showRecoveryDiagnostic(
            documentRef: Document,
            message: string,
            isError = false
          ): void {
            let element = documentRef.getElementById(FIRESTORE_RECOVERY_DIAGNOSTIC_ID);
            if (!element) {
              element = documentRef.createElement('div');
              element.id = FIRESTORE_RECOVERY_DIAGNOSTIC_ID;
              element.setAttribute('aria-live', 'assertive');
              element.style.cssText = [
                'position:fixed',
                'left:16px',
                'right:16px',
                'top:max(16px, env(safe-area-inset-top))',
                'z-index:2147483647',
                'padding:14px 16px',
                'border-radius:16px',
                'background:#17171b',
                'border:1px solid rgba(229,169,61,.45)',
                'box-shadow:0 16px 50px rgba(0,0,0,.55)',
                'color:#f5f5f7',
                'font:600 14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'
              ].join(';');
              (documentRef.body || documentRef.documentElement).appendChild(element);
            }
            element.setAttribute('role', isError ? 'alert' : 'status');
            element.textContent = message;
          }

          function readSharedState(storage: Storage): FirestoreRecoveryState | null {
            try {
              return parseFirestoreRecoveryState(storage.getItem(FIRESTORE_RECOVERY_STORAGE_KEY));
            } catch {
              return null;
            }
          }

          function writeSharedState(storage: Storage, state: FirestoreRecoveryState): boolean {
            try {
              storage.setItem(FIRESTORE_RECOVERY_STORAGE_KEY, JSON.stringify(state));
              return true;
            } catch {
              return false;
            }
          }

          async function resolveCurrentDatabaseNames(
            factory: IndexedDbFactoryWithListing,
            config: FirestoreRecoveryConfig
          ): Promise<string[]> {
            const expected = buildFirestoreIndexedDbName(config.projectId, config.databaseId);
            if (typeof factory.databases !== 'function') return [expected];
            try {
              const databases = await factory.databases.call(factory);
              const exact = selectCurrentFirestoreDatabaseNames(databases, config);
              return exact.length > 0 ? exact : [expected];
            } catch {
              return [expected];
            }
          }

          function deleteIndexedDbDatabase(
            factory: IDBFactory,
            name: string,
            timeoutMs = 5000
          ): Promise<boolean> {
            return new Promise(resolve => {
              let settled = false;
              const finish = (value: boolean) => {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                resolve(value);
              };
              const timer = window.setTimeout(() => finish(false), timeoutMs);
              try {
                const request = factory.deleteDatabase(name);
                request.onsuccess = () => finish(true);
                request.onerror = () => finish(false);
                request.onblocked = () => {
                  // Les autres onglets reçoivent d'abord le signal prepare et libèrent Firestore.
                  // On laisse la requête ouverte jusqu'au succès ou au timeout borné.
                };
              } catch {
                finish(false);
              }
            });
          }

          export interface InstallFirestoreRecoveryOptions extends FirestoreRecoveryConfig {
            terminateFirestore: () => Promise<unknown>;
            windowRef?: Window;
            documentRef?: Document;
            indexedDbFactory?: IDBFactory;
            storage?: Storage;
            now?: () => number;
            reload?: () => void;
          }

          export function installFirestoreIndexedDbRecovery(
            options: InstallFirestoreRecoveryOptions
          ): () => void {
            const windowRef = options.windowRef ?? window;
            const documentRef = options.documentRef ?? document;
            const factory = (options.indexedDbFactory ?? indexedDB) as IndexedDbFactoryWithListing;
            const storage = options.storage ?? windowRef.localStorage;
            const now = options.now ?? (() => Date.now());
            const reload = options.reload ?? (() => windowRef.location.reload());
            const config: FirestoreRecoveryConfig = {
              projectId: options.projectId,
              databaseId: options.databaseId
            };
            let followerTerminated = false;
            let handling = false;

            const terminateSafely = async () => {
              if (followerTerminated) return;
              followerTerminated = true;
              await options.terminateFirestore().catch(() => undefined);
            };

            const handleStorage = (event: StorageEvent) => {
              if (event.key !== FIRESTORE_RECOVERY_STORAGE_KEY) return;
              const state = parseFirestoreRecoveryState(event.newValue);
              if (!sameRecoveryTarget(state, config)) return;

              if (state.phase === 'prepare') {
                showRecoveryDiagnostic(
                  documentRef,
                  'SeenIt répare le cache Firestore dans un autre onglet. Cet onglet attend la fin de la réparation…'
                );
                void terminateSafely();
              } else if (state.phase === 'reload') {
                showRecoveryDiagnostic(documentRef, 'Cache Firestore réparé. SeenIt redémarre…');
                windowRef.setTimeout(reload, 250);
              } else {
                showRecoveryDiagnostic(
                  documentRef,
                  'La réparation du cache Firestore n’a pas pu se terminer. Ferme les autres onglets SeenIt puis relance l’application.',
                  true
                );
              }
            };

            const handleUnhandledRejection = async (event: PromiseRejectionEvent) => {
              if (handling || !isFirestoreIndexedDbCorruption(event.reason)) return;
              handling = true;
              event.preventDefault();

              const existing = readSharedState(storage);
              const decision = decideFirestoreRecovery(existing, now(), config);

              if (decision === 'stop') {
                showRecoveryDiagnostic(
                  documentRef,
                  'SeenIt a déjà tenté de réparer le cache Firestore. Le redémarrage automatique est interrompu pour éviter une boucle. Ferme puis rouvre l’application ; sur le Web, ferme aussi les autres onglets SeenIt.',
                  true
                );
                handling = false;
                return;
              }

              if (decision === 'follow') {
                showRecoveryDiagnostic(
                  documentRef,
                  'SeenIt répare le cache Firestore dans un autre onglet. Cet onglet attend la fin de la réparation…'
                );
                await terminateSafely();
                handling = false;
                return;
              }

              const attempt: FirestoreRecoveryState = {
                version: 1,
                ...config,
                attemptId: createAttemptId(),
                startedAt: now(),
                phase: 'prepare'
              };

              const shared = writeSharedState(storage, attempt);
              if (shared) {
                await Promise.resolve();
                const winner = readSharedState(storage);
                if (!winner || winner.attemptId !== attempt.attemptId) {
                  showRecoveryDiagnostic(
                    documentRef,
                    'SeenIt répare le cache Firestore dans un autre onglet. Cet onglet attend la fin de la réparation…'
                  );
                  await terminateSafely();
                  handling = false;
                  return;
                }
              }

              showRecoveryDiagnostic(
                documentRef,
                'SeenIt a détecté un problème dans le cache Firestore local. Réparation sécurisée en cours…'
              );

              await terminateSafely();
              // Laisse aux autres onglets le temps de recevoir le signal localStorage et de libérer leur connexion.
              await new Promise(resolve => windowRef.setTimeout(resolve, 150));

              const names = await resolveCurrentDatabaseNames(factory, config);
              const results = await Promise.all(names.map(name => deleteIndexedDbDatabase(factory, name)));
              const repaired = results.every(Boolean);

              if (!repaired) {
                const failed: FirestoreRecoveryState = { ...attempt, phase: 'failed' };
                writeSharedState(storage, failed);
                showRecoveryDiagnostic(
                  documentRef,
                  'La réparation du cache Firestore n’a pas pu se terminer. Ferme les autres onglets SeenIt puis relance l’application.',
                  true
                );
                handling = false;
                return;
              }

              const completed: FirestoreRecoveryState = { ...attempt, phase: 'reload' };
              writeSharedState(storage, completed);
              showRecoveryDiagnostic(documentRef, 'Cache Firestore réparé. SeenIt redémarre…');
              windowRef.setTimeout(reload, 700);
            };

            windowRef.addEventListener('storage', handleStorage);
            windowRef.addEventListener('unhandledrejection', handleUnhandledRejection);

            return () => {
              windowRef.removeEventListener('storage', handleStorage);
              windowRef.removeEventListener('unhandledrejection', handleUnhandledRejection);
            };
          }
          EOF

          cat > tests/firestoreRecovery.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            FIRESTORE_RECOVERY_WINDOW_MS,
            buildFirestoreIndexedDbName,
            decideFirestoreRecovery,
            isFirestoreIndexedDbCorruption,
            selectCurrentFirestoreDatabaseNames,
            type FirestoreRecoveryState
          } from '../src/lib/firestoreRecovery.ts';

          const config = {
            projectId: 'gen-lang-client-0201895414',
            databaseId: 'default'
          };

          test('SEENIT-DATA-004 sélectionne uniquement la base Firestore exacte du projet courant', () => {
            const expected = 'firestore/[DEFAULT]/gen-lang-client-0201895414.default/main';
            assert.equal(buildFirestoreIndexedDbName(config.projectId, config.databaseId), expected);
            assert.deepEqual(
              selectCurrentFirestoreDatabaseNames([
                { name: expected },
                { name: 'firestore/[DEFAULT]/gen-lang-client-0201895414/main' },
                { name: 'firestore/[DEFAULT]/gen-lang-client-0201895414.archive/main' },
                { name: 'firestore/[DEFAULT]/un-autre-projet.default/main' },
                { name: 'firebaseLocalStorageDb' },
                { name: 'seenit-cache' }
              ], config),
              [expected]
            );
            assert.equal(
              buildFirestoreIndexedDbName('gen-lang-client-0201895414', '(default)'),
              'firestore/[DEFAULT]/gen-lang-client-0201895414/main'
            );
          });

          test('SEENIT-DATA-004 partage une seule tentative entre onglets et casse la boucle de rechargement', () => {
            const now = 1_800_000_000_000;
            assert.equal(decideFirestoreRecovery(null, now, config), 'attempt');

            const preparing: FirestoreRecoveryState = {
              version: 1,
              ...config,
              attemptId: 'onglet-a',
              startedAt: now,
              phase: 'prepare'
            };
            assert.equal(decideFirestoreRecovery(preparing, now + 100, config), 'follow');

            const completed: FirestoreRecoveryState = { ...preparing, phase: 'reload' };
            assert.equal(decideFirestoreRecovery(completed, now + 500, config), 'stop');

            const failed: FirestoreRecoveryState = { ...preparing, phase: 'failed' };
            assert.equal(decideFirestoreRecovery(failed, now + 500, config), 'stop');

            assert.equal(
              decideFirestoreRecovery(completed, now + FIRESTORE_RECOVERY_WINDOW_MS + 1, config),
              'attempt'
            );
            assert.equal(
              decideFirestoreRecovery(completed, now + 500, { ...config, projectId: 'autre-projet' }),
              'attempt'
            );
          });

          test('SEENIT-DATA-004 limite la réparation aux assertions internes Firestore', () => {
            assert.equal(
              isFirestoreIndexedDbCorruption(new Error('INTERNAL ASSERTION FAILED: Unexpected state')),
              true
            );
            assert.equal(isFirestoreIndexedDbCorruption('INTERNAL ASSERTION FAILED'), true);
            assert.equal(isFirestoreIndexedDbCorruption(new Error('Failed to fetch')), false);
            assert.equal(isFirestoreIndexedDbCorruption(null), false);
          });
          EOF

          python3 <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Motif introuvable dans {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # La base Firestore nommée utilisée par SeenIt devient une constante partagée avec la récupération.
          replace_once(
              'src/lib/firebase.ts',
              "const isNative = Capacitor.isNativePlatform();\n\nexport const db = initializeFirestore(\n",
              "const isNative = Capacitor.isNativePlatform();\n\nexport const FIRESTORE_DATABASE_ID = 'default';\n\nexport const db = initializeFirestore(\n"
          )
          replace_once(
              'src/lib/firebase.ts',
              "    experimentalForceLongPolling: isNative\n  },\n  'default'\n);",
              "    experimentalForceLongPolling: isNative\n  },\n  FIRESTORE_DATABASE_ID\n);"
          )

          main = Path('src/main.tsx')
          text = main.read_text()
          text = text.replace(
              "import {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n",
              "import {createRoot} from 'react-dom/client';\nimport { terminate } from 'firebase/firestore';\nimport App from './App.tsx';\nimport { db, FIRESTORE_DATABASE_ID } from './lib/firebase.ts';\nimport { installFirestoreIndexedDbRecovery } from './lib/firestoreRecovery.ts';\nimport firebaseConfig from '../firebase-applet-config.json';\nimport './index.css';\n"
          )
          old_handler = """if (typeof window !== 'undefined') {
            window.addEventListener('unhandledrejection', (event) => {
              const errorMsg = event.reason?.message || '';
              if (errorMsg.includes('INTERNAL ASSERTION FAILED')) {
                console.error('Firestore IndexedDB corruption detected. Reloading...');
                // Nettoyage radical de l'indexeddb Firestore pour éviter une boucle de crash
                indexedDB.deleteDatabase('firestore/[DEFAULT]/ais-dev-mooctibtw2amkshvkzlqij-700628279309/main');
                indexedDB.deleteDatabase('firestore/[DEFAULT]/ais-pre-mooctibtw2amkshvkzlqij-700628279309/main');
                setTimeout(() => window.location.reload(), 1000);
              }
            });
          }
          """
          new_handler = """if (typeof window !== 'undefined') {
            const disposeFirestoreRecovery = installFirestoreIndexedDbRecovery({
              projectId: firebaseConfig.projectId,
              databaseId: FIRESTORE_DATABASE_ID,
              terminateFirestore: () => terminate(db)
            });
            import.meta.hot?.dispose(disposeFirestoreRecovery);
          }
          """
          if old_handler not in text:
              raise SystemExit('Ancien gestionnaire IndexedDB introuvable dans main.tsx')
          main.write_text(text.replace(old_handler, new_handler, 1))

          spec = Path('docs/specifications/seenit.md')
          text = spec.read_text()
          marker = """- **SEENIT-DATA-003** — Les journaux techniques persistés localement sont partitionnés par UID.
            L'ancien journal global est supprimé et aucun log collecté avant authentification n'est persisté.
          """
          addition = marker + """- **SEENIT-DATA-004** — Lorsqu'une assertion interne Firestore indique une corruption de la
            persistance IndexedDB, SeenIt cible exclusivement la base locale correspondant au `projectId` et au
            `databaseId` réellement configurés. Une seule tentative automatique est autorisée pendant cinq
            minutes et son état est partagé par `localStorage` : en PWA, les autres onglets libèrent leur client
            Firestore avant la suppression puis ne rechargent qu'après le signal de succès ; dans l'APK, la même
            garde s'applique à l'unique WebView. Un diagnostic visible précède tout rechargement et une seconde
            erreur dans la fenêtre de garde interrompt l'automatisme afin d'éviter une boucle. Les autres bases
            IndexedDB de l'origine ne sont jamais supprimées.
          """
          if marker not in text:
              raise SystemExit('Emplacement SEENIT-DATA-003 introuvable dans la SPEC')
          spec.write_text(text.replace(marker, addition, 1))

          req_path = Path('docs/specifications/requirements.json')
          req = json.loads(req_path.read_text())
          if any(item['id'] == 'SEENIT-DATA-004' for item in req['requirements']):
              raise SystemExit('SEENIT-DATA-004 existe déjà')
          new_req = {
              'id': 'SEENIT-DATA-004',
              'title': 'Récupération Firestore IndexedDB ciblée et anti-boucle',
              'targets': ['pwa', 'apk'],
              'tests': [
                  {
                      'file': 'tests/firestoreRecovery.test.ts',
                      'contains': 'SEENIT-DATA-004 sélectionne uniquement la base Firestore exacte du projet courant'
                  },
                  {
                      'file': 'tests/firestoreRecovery.test.ts',
                      'contains': 'SEENIT-DATA-004 partage une seule tentative entre onglets et casse la boucle de rechargement'
                  }
              ]
          }
          index = next(i for i, item in enumerate(req['requirements']) if item['id'] == 'SEENIT-DATA-003') + 1
          req['requirements'].insert(index, new_req)
          req_path.write_text(json.dumps(req, ensure_ascii=False, indent=2) + '\n')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text, count = re.subn(r'versionName\s+[\"\']1\.4\.82[\"\']', 'versionName "1.4.83"', text, count=1)
          if count != 1:
              raise SystemExit('versionName 1.4.82 introuvable')
          gradle.write_text(text)
          PY

          npm run version:sync

          git config user.name "julfou7"
          git config user.email "julianfouillade@gmail.com"
          git add src/lib/firestoreRecovery.ts src/lib/firebase.ts src/main.tsx tests/firestoreRecovery.test.ts docs/specifications/seenit.md docs/specifications/requirements.json android/app/build.gradle src/store/updateStore.ts server.ts package.json package-lock.json docs/specifications/android-contract.json
          git commit -m "fix: sécuriser la récupération du cache Firestore" -m "- cible uniquement l’IndexedDB Firestore du projet et de la base réellement configurés
          - coordonne les onglets PWA avant suppression et conserve le même garde-fou dans l’APK
          - borne la réparation automatique à une tentative sur cinq minutes et coupe les boucles de rechargement
          - affiche un diagnostic lisible avant redémarrage ou en cas d’échec
          - ajoute SEENIT-DATA-004 et les tests de sélection stricte et de coordination multi-onglets
          - aligne SeenIt 1.4.83 sur toutes les surfaces de version"

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Contrat de changement SPEC
        env:
          SPEC_BASE_SHA: 9ef6ee2e31f69e28d575c8d65fc02e67e40e2cc2
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          npm run test:spec:changes

      - name: SPEC, contrat Android, TypeScript et tests
        run: npm test

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Build PWA et synchronisation Capacitor
        run: |
          npm run build
          npx cap sync android
          npm run test:android

      - name: Compiler l’APK de validation
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Retirer le workflow temporaire et finaliser la branche
        run: |
          git rm .github/workflows/temp-issue10-firestore-recovery.yml
          git add android
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:fix/issue-10-firestore-recovery
