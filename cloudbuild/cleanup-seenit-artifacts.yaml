steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if gcloud artifacts packages describe "${_SERVICE}"           --repository="${_REPOSITORY}"           --location="${_REGION}" >/dev/null 2>&1; then
          gcloud artifacts packages delete "${_SERVICE}"             --repository="${_REPOSITORY}"             --location="${_REGION}"             --quiet
        else
          echo "Package Artifact Registry ${_SERVICE} déjà absent."
        fi

        source_bucket="gs://${PROJECT_ID}_cloudbuild/source"
        if gcloud storage ls "$$source_bucket/" >/dev/null 2>&1; then
          gcloud storage rm "$$source_bucket/**"
        else
          echo "Archives source Cloud Build déjà absentes."
        fi
options:
  logging: CLOUD_LOGGING_ONLY
