<!doctype html>
<html lang="fr" style="background-color: #040406; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#040406" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SeenIt" />
    <link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>SeenIt</title>
    <style>
      body {
        background-color: #040406;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color-scheme: dark;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .instant-splash {
        position: fixed;
        inset: 0;
        background-color: #040406;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .instant-bloom {
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245,197,24,0.28) 0%, rgba(217,119,6,0.08) 50%, transparent 70%);
        filter: blur(50px);
        pointer-events: none;
      }
      .instant-title {
        display: flex;
        align-items: center;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-top: 4px;
      }
      .instant-title-white {
        color: #ffffff;
      }
      .instant-title-gold {
        background: linear-gradient(to right, #FFF4D0, #F5C518, #E5A93D);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-left: 2px;
      }
      .instant-tagline {
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant 0ms Zero-Latency Splash Layout -->
      <div class="instant-splash">
        <div class="instant-bloom"></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
          <svg width="112" height="112" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 20px;">
            <defs>
              <linearGradient id="init-gold-grad" x1="10%" y1="10%" x2="90%" y2="90%">
                <stop offset="0%" stopColor="#FFF4D0" />
                <stop offset="25%" stopColor="#FDE68A" />
                <stop offset="55%" stopColor="#F5C518" />
                <stop offset="85%" stopColor="#E5A93D" />
                <stop offset="100%" stopColor="#B37812" />
              </linearGradient>
              <linearGradient id="init-check-grad" x1="15%" y1="15%" x2="85%" y2="85%">
                <stop offset="0%" stopColor="#FFFFFF" />
                <stop offset="20%" stopColor="#FFF2B8" />
                <stop offset="55%" stopColor="#F5C518" />
                <stop offset="85%" stopColor="#E5A93D" />
                <stop offset="100%" stopColor="#D97706" />
              </linearGradient>
              <linearGradient id="init-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.18" />
                <stop offset="45%" stopColor="#FFFFFF" stopOpacity="0.03" />
                <stop offset="70%" stopColor="#000000" stopOpacity="0" />
              </linearGradient>
            </defs>
            <rect x="28" y="34" width="144" height="104" rx="20" fill="#E5A93D" fill-opacity="0.12" filter="blur(10px)" />
            <rect x="28" y="34" width="144" height="104" rx="20" fill="#08080C" stroke="url(#init-gold-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 32 52 L 136 36 L 32 120 Z" fill="url(#init-glass-grad)" />
            <path d="M 100 138 L 100 157" stroke="url(#init-gold-grad)" stroke-width="7" stroke-linecap="round" />
            <path d="M 64 158 C 64 158 82 156 100 156 C 118 156 136 158 136 158" stroke="url(#init-gold-grad)" stroke-width="7" stroke-linecap="round" />
            <path d="M 75 87 L 93 104 L 127 67" fill="none" stroke="url(#init-check-grad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="127" cy="67" r="3.5" fill="#FFFFFF" opacity="0.85" />
          </svg>
          <div class="instant-title">
            <span class="instant-title-white">Seen</span><span class="instant-title-gold">It</span>
          </div>
          <div class="instant-tagline">L'expérience cinéma & séries</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
