<!doctype html>
<html lang="fr" style="background-color: #040406; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#040406" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SeenIt" />
    <link rel="icon" type="image/png" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>SeenIt</title>
    <style>
      body {
        background-color: #040406;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color-scheme: dark;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .instant-splash {
        position: fixed;
        inset: 0;
        background-color: #040406;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .instant-bloom {
        position: absolute;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245,197,24,0.28) 0%, rgba(217,119,6,0.08) 50%, transparent 70%);
        filter: blur(50px);
        pointer-events: none;
      }
      .instant-title {
        display: flex;
        align-items: center;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-top: 4px;
      }
      .instant-title-white {
        color: #ffffff;
      }
      .instant-title-gold {
        background: linear-gradient(to right, #FFF4D0, #F5C518, #E5A93D);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-left: 2px;
      }
      .instant-tagline {
        color: #a1a1aa;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant 0ms Zero-Latency Splash Layout -->
      <div class="instant-splash">
        <div class="instant-bloom"></div>
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
          <img src="/brand/seenit-logo-empile-sombre.svg" alt="SeenIt" width="220" height="214" />
          <div class="instant-tagline">Chaque visionnage compte.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
